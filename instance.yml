AWSTemplateFormatVersion:          '2010-09-09'
Description:                       'Auto Scaling Group (0/1) that serves 7 Days to Die'

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to use

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Subnet the Auto Scaling Group launches into. MUST be in the same
      Availability Zone as the save volume and Elastic IP (the volume is
      created in the region's first AZ, the -a suffix, so pick a subnet in
      that AZ). A single EBS volume attaches to one instance in one AZ, so
      the ASG is pinned here.

  InstanceType:
    Description: EC2 instance type (memory-optimized for large V3.0 RWG worlds; r8i.xlarge = 4 vCPU / 32 GiB)
    Type: String
    Default: r8i.xlarge

  AMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: >-
      Path of the public SSM parameter that Canonical keeps pointed at the
      latest Ubuntu 24.04 LTS AMI. This field takes the parameter path, not an
      AMI id.
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  KeyPair:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of SSH keypair

  S3BucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Description: >-
      Name of the SSM parameter that holds the name of the S3 bucket that
      receives the address file (the server IP and port). This field takes the
      SSM parameter name, not the bucket name.
    Default: 7days-server-ip-bucket

  PortNumber:
    Type: Number
    Description: Primary game port (modern 7DTD default is 26900)
    Default: 26900

  PortNumberTop:
    Type: Number
    Description: >-
      Top of the game port range opened in the security group. Each server in
      the Servers parameter claims four consecutive ports starting at
      PortNumber, so this must be at least PortNumber + 4 * (number of servers)
      - 1: 26903 for one server, 26907 for two, 26911 for three. The bootstrap
      refuses to start a server whose ports fall outside this range.
    Default: 26903

  GamePassword:
    Type: AWS::SSM::Parameter::Value<String>
    Description: >-
      Name of the SSM parameter that holds the password players type to join
      the server (serverconfig ServerPassword). This field takes the SSM
      parameter name, not the password: the password stays in SSM, like the
      admin password, so it is not baked into the template. An SSM parameter
      cannot hold an empty string, so store the literal text 'none' in that
      parameter for an open server that anyone who has the address can join.
      Do not type 'none' here - CloudFormation then looks for an SSM parameter
      named 'none' and the stack fails.
    Default: 7days-game-password

  AdminPassword:
    Type: AWS::SSM::Parameter::Value<String>
    Description: >-
      Name of the SSM parameter that holds the server console password
      (serverconfig TelnetPassword). This field takes the SSM parameter name,
      not the password. The console password is the operator credential: the
      idle check, self-heal check, spot drain and login watcher all
      authenticate to the telnet console with it. It is not the player join
      password.
    Default: 7days-admin-password

  NotifyEmail:
    Type: AWS::SSM::Parameter::Value<String>
    Description: >-
      Name of the SSM parameter that holds the email address that receives a
      notification when the server becomes joinable, when its host shuts down,
      and every time a player joins. This field takes the SSM parameter name,
      not the address: the address stays in SSM, like the passwords, so it is
      not baked into the template. SNS sends a one-time confirmation link that
      must be clicked before any notification is delivered.
    Default: 7days-notify-email

  WorldGenSeed:
    Type: String
    Description: >-
      Seed for the random-gen map. Any string; the same seed and size always
      generate the same world. Only used when GameWorld is RWG. Changing it
      after a world exists does NOT regenerate it - the save on the volume
      keeps being used.
    Default: SevenDaysOnAws

  SandboxCode:
    Type: String
    Description: >-
      V3.0 sandbox configuration string (encodes difficulty, zombie speed, loot,
      blood moon, drop-on-death, day length, etc). Generate your own from the
      in-game Sandbox Options menu. Default is the standard Adventurer preset.
    Default: AAAJABJACJADJARFBNC

  AutoShutdown:
    Type: String
    Description: >-
      Whether the server auto-scales the ASG to zero after being empty for the
      idle grace window (IdleGraceMinutes). Set to disabled to keep it running until
      it is stopped manually (7days.bat stop, i.e. desired capacity 0). Toggling
      this on a running server takes effect within the cfn-hup poll interval.
    AllowedValues:
      - enabled
      - disabled
    Default: enabled

  # --- The server set --------------------------------------------------------

  Servers:
    Type: String
    Description: >-
      JSON array of the worlds this one instance hosts, one object per server.
      Only "Slug" is required (1-32 characters of A-Za-z0-9_- starting
      alphanumeric); it names the save folder, the systemd unit, the S3 address
      object and the backup prefix, so keep it stable - changing it starts a new
      world. Every other field is optional and falls back to the matching
      parameter below: ServerName, ServerDescription, ServerWebsiteURL,
      ServerVisibility, ServerMaxPlayerCount, ServerReservedSlots,
      ServerReservedSlotsPermission, GameWorld, GameName, WorldGenSeed,
      WorldGenSize, SandboxCode, PlayerKillingMode, AdminSteamIds,
      AdminPermissionLevel, ServerPropertyOverrides. Ports are allocated from
      each record's position in the list, not set here. Example:
      [{"Slug":"main"},{"Slug":"pvp","ServerName":"PvP","GameName":"PvPWorld","PlayerKillingMode":"3"}].
      Adding servers means raising PortNumberTop and sizing InstanceType for
      them - see the README.
    Default: '[{"Slug":"main"}]'
    MinLength: 1

  # --- Server identity (what players see in the server browser) --------------
  # These are the defaults every entry in Servers inherits for the fields it
  # does not set itself. They land in serverconfig.xml as attribute values, so
  # any text here must be XML-safe: write & as &amp; and < as &lt;, and do not
  # use a double quote.

  ServerName:
    Type: String
    Description: Name shown in the server browser.
    Default: 7 Days to Die on AWS
    MinLength: 1

  ServerDescription:
    Type: String
    Description: Description shown in the server browser.
    Default: A 7 Days to Die dedicated server running on AWS.

  ServerWebsiteURL:
    Type: String
    Description: Website link shown in the server browser. Leave empty for none.
    Default: ''

  ServerVisibility:
    Type: Number
    Description: >-
      0 = not listed (join by IP only), 1 = friends only, 2 = public listing in
      the server browser.
    AllowedValues:
      - 0
      - 1
      - 2
    Default: 2

  ServerMaxPlayerCount:
    Type: Number
    Description: Maximum concurrent players.
    Default: 16
    MinValue: 1

  ServerReservedSlots:
    Type: Number
    Description: >-
      Slots held back for players whose permission level is at or above
      ServerReservedSlotsPermission (see AdminPermissionLevel; a LOWER number
      means more power).
    Default: 2
    MinValue: 0

  ServerReservedSlotsPermission:
    Type: Number
    Description: Permission level required to claim a reserved slot.
    Default: 100
    MinValue: 0
    MaxValue: 1000

  # --- Admins ----------------------------------------------------------------

  AdminSteamIds:
    Type: String
    Description: >-
      Comma-separated SteamID64s granted admin on the server - the 17-digit id
      at the end of a steamcommunity.com/profiles/ URL, e.g.
      "76561197960265728,76561197960265729". Empty (the default) means no
      admins are configured. Rewritten on every launch from this parameter, so
      in-game admin edits do not survive a relaunch.
    Default: ''
    AllowedPattern: '^\s*([0-9]{17}\s*(,\s*[0-9]{17}\s*)*)?$'
    ConstraintDescription: >-
      Must be empty, or a comma-separated list of 17-digit SteamID64 values.

  AdminPermissionLevel:
    Type: Number
    Description: >-
      Permission level given to every id in AdminSteamIds. 0 is full admin,
      1000 is a default player - LOWER means MORE power.
    Default: 0
    MinValue: 0
    MaxValue: 1000

  # --- World -----------------------------------------------------------------

  GameWorld:
    Type: String
    Description: >-
      RWG for a random-generated world (uses WorldGenSeed and WorldGenSize), or
      the name of a prebuilt world such as Navezgane.
    Default: RWG
    MinLength: 1

  GameName:
    Type: String
    Description: >-
      Save game name. This names the save folder on the persistent volume, so
      changing it starts a new world rather than loading the existing one.
    Default: SevenDaysOnAws
    MinLength: 1

  WorldGenSize:
    Type: Number
    Description: >-
      Random-gen world size in metres; must be a multiple of 1024 between 4096
      and 16384. Bigger worlds need more memory (see InstanceType).
    Default: 6144
    MinValue: 4096
    MaxValue: 16384

  PlayerKillingMode:
    Type: Number
    Description: >-
      0 = no player killing, 1 = kill allies only, 2 = kill strangers only,
      3 = kill everyone.
    AllowedValues:
      - 0
      - 1
      - 2
      - 3
    Default: 2

  ServerPropertyOverrides:
    Type: String
    Description: >-
      Escape hatch for every serverconfig.xml property that does not have its
      own parameter above (land claims, zombie counts, safe zones, EAC,
      crossplay, dynamic mesh, and so on). Comma-separated Name=Value pairs,
      e.g. "MaxSpawnedZombies=64,EACEnabled=true,LandClaimSize=41". Each entry
      replaces that property if the template already writes it, and is appended
      if it does not. A value may contain an equals sign (only the first one
      splits the pair) but not a comma, and must be XML-safe.
    Default: ''

  # --- Console and web dashboard ---------------------------------------------

  TelnetPort:
    Type: Number
    Description: >-
      Base port for the telnet console, on localhost only - it is deliberately
      not opened in the security group. Server N gets TelnetPort + N. The idle,
      health, drain and login-watcher scripts all talk to each server through
      its own console port.
    Default: 8081
    MinValue: 1
    MaxValue: 65535

  WebDashboardEnabled:
    Type: String
    Description: >-
      Whether the game's web dashboard listens on WebDashboardPort. Also not
      opened in the security group, so reaching it means tunnelling in (e.g.
      SSH port-forward) - it is not exposed to the internet by this template.
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'

  WebDashboardPort:
    Type: Number
    Description: >-
      Base port for the game's web dashboard. Server N gets
      WebDashboardPort + N. The default sits well clear of TelnetPort so the
      two ranges cannot grow into each other; the bootstrap refuses to start if
      they ever do.
    Default: 8200
    MinValue: 1
    MaxValue: 65535

  # --- Operational timings ---------------------------------------------------

  IdleGraceMinutes:
    Type: Number
    Description: >-
      How long the server must be continuously empty before the idle check
      scales the ASG to zero. Only used when AutoShutdown is enabled.
    Default: 120
    MinValue: 1

  IdleCheckMinutes:
    Type: Number
    Description: How often to check whether any players are connected.
    Default: 20
    MinValue: 1

  HealthCheckMinutes:
    Type: Number
    Description: >-
      How often to check that the game console still answers. Also bounds how
      late the "server is up" email can be, since that is sent on the first
      successful check of a boot.
    Default: 5
    MinValue: 1

  HealthCheckFailureThreshold:
    Type: Number
    Description: >-
      Consecutive unreachable checks before the instance marks itself Unhealthy
      and lets the ASG replace it. Never applies until the console has answered
      at least once this boot.
    Default: 3
    MinValue: 1

  BackupIntervalHours:
    Type: Number
    Description: >-
      How often to upload a save archive to S3 during a long session. The first
      archive of each boot is taken 10 minutes in regardless.
    Default: 24
    MinValue: 1

  DailyRefresh:
    Type: String
    Description: >-
      Whether the instance replaces itself once a day, so a long-lived server
      picks up a fresh host, whatever AMIID now resolves to, and a fresh spot
      pool instead of accumulating uptime. The refresh only fires when the
      server is empty; players connected at that moment defer it to the next
      day, so a server occupied every day at DailyRefreshTime never refreshes.
      Toggling this on a running server takes effect within the cfn-hup poll
      interval.
    AllowedValues:
      - enabled
      - disabled
    Default: enabled

  DailyRefreshTime:
    Type: String
    Description: >-
      Time of day in UTC, HH:MM, that the daily refresh checks whether it can
      replace the instance. Pick an hour nobody plays; the default is early
      morning in New Zealand, an hour ahead of backup.yml's default snapshot
      time so the snapshot catches a just-saved volume.
    Default: '15:00'
    AllowedPattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$

  # --- Naming ----------------------------------------------------------------

  AddressObjectPrefix:
    Type: String
    Description: >-
      Prefix for the objects written to the S3 bucket above holding each
      server's "ip:port" address. One object per server, keyed
      <prefix><slug>.txt - so the default writes 7dserver-main.txt for a
      server whose Slug is "main". May contain a path prefix.
    Default: 7dserver-
    MinLength: 1

  AccessControlTagValue:
    Type: String
    Description: >-
      Value of the AccessControl tag on the ASG and instances. This is what
      7days.bat filters on and what an IAM policy can condition on to let
      someone start/stop this server and nothing else. Give each deployment its
      own value if you run more than one.
    Default: 7Days
    MinLength: 1

Resources:

  # --- Server notifications --------------------------------------------------
  # The instance publishes here when the server becomes joinable, when its host
  # shuts down, and when a player joins; SNS fans each one out to the email
  # address in the NotifyEmail SSM parameter. The subscription is declared
  # inline because there is exactly one, and SNS emails it a confirmation link
  # on first create - notifications only flow once that link is clicked. The
  # topic lives in this stack, so deleting and recreating the stack (or changing
  # the address) means confirming again. DisplayName is what recipients see as
  # the sender name on the email.
  NotifyTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-notifications
      DisplayName: 7DTD
      Subscription:
        - Protocol: email
          Endpoint: !Ref NotifyEmail

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ec2
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service:
              - ec2.amazonaws.com
          Action:
            - sts:AssumeRole
      Path: /
      # AmazonSSMManagedInstanceCore lets the pre-installed SSM agent register
      # the instance so we can open Session Manager shells (no SSH/inbound rule).
      # CloudWatchAgentServerPolicy lets the CloudWatch agent push memory/disk/
      # swap metrics (cloudwatch:PutMetricData) and read the instance tags it
      # attaches as dimensions (ec2:DescribeTags).
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
        - !Sub arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-bootstrap
          PolicyDocument:
            Statement:
              # Publish the static server address for clients to discover, and
              # upload save archives to the backup bucket (backup.yml) under the
              # saves/ prefix its lifecycle rule expires.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${S3BucketName}/${AddressObjectPrefix}*
                  - !Sub
                    - ${BucketArn}/saves/*
                    - BucketArn: !ImportValue Seven-Days-Server-Backup-Bucket-Arn
              # Read the volume id and Elastic IP from the sibling stacks'
              # exports at boot. ListExports has no resource-level scoping.
              - Effect: Allow
                Action:
                  - cloudformation:ListExports
                Resource: '*'
              # Under an ASG the instance attaches its own storage. Scope
              # AttachVolume to the specific save volume and any instance
              # (the ASG-launched instance id is not known ahead of time).
              - Effect: Allow
                Action:
                  - ec2:AttachVolume
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub
                    - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/${Vol}
                    - Vol: !ImportValue Seven-Days-Server-Disk
              # Self-associate the Elastic IP on boot. AssociateAddress does not
              # support reliable resource-level scoping across the instance + EIP
              # + primary ENI it touches, so allow it broadly on this dedicated
              # single-purpose role.
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                Resource: '*'
              # Describe calls used by the attach wait loop; no resource scoping.
              - Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeAddresses
                Resource: '*'
              # Idle-stop (terminate + decrement), daily refresh (terminate,
              # keeping desired capacity so the ASG relaunches) and self-heal
              # (set unhealthy), scoped to this stack's Auto Scaling Group.
              - Effect: Allow
                Action:
                  - autoscaling:SetInstanceHealth
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-asg
              # Publish server start/stop and player-login notifications to this
              # stack's topic.
              - Effect: Allow
                Action:
                  - sns:Publish
                Resource:
                  - !Ref NotifyTopic
              # cfn-init (at boot) and cfn-hup (on every metadata change) read
              # this stack's resource metadata via DescribeStackResource.
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                Resource:
                  - !Ref AWS::StackId

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Ref AWS::StackName
      GroupDescription: Security group for 7dtd server
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      SecurityGroupIngress:
        # Modern 7DTD uses TCP + UDP across ServerPort..ServerPort+3 (26900-26903,
        # the top port covering EOS/crossplay). Open to anywhere over both IPv4
        # (0.0.0.0/0) and IPv6 (::/0).
        - CidrIp: 0.0.0.0/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumberTop
          IpProtocol: udp
        - CidrIpv6: ::/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumberTop
          IpProtocol: udp
        - CidrIp: 0.0.0.0/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumberTop
          IpProtocol: tcp
        - CidrIpv6: ::/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumberTop
          IpProtocol: tcp

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Metadata:
      # The full server bootstrap lives in this LaunchTemplate's
      # AWS::CloudFormation::Init metadata, fetched from the CloudFormation
      # service by cfn-init at boot, because EC2 UserData is hard-capped at
      # 16 KB and the script no longer fits. UserData is now a small stub
      # that installs the aws-cfn-bootstrap helpers and runs cfn-init;
      # cfn-hup then re-runs cfn-init in place whenever this Metadata changes.
      AWS::CloudFormation::Init:
        configSets:
          # cfn-hup first so the poll timer is running even if the bootstrap
          # fails, letting a corrected stack update re-trigger it in place.
          default:
            - cfnhup
            - bootstrap
          # cfn-hup wiring only - lets an operator refresh the poll units in
          # place (cfn-init --configsets hup) without re-running the heavy game
          # bootstrap, which would restart the running server.
          hup:
            - cfnhup
        cfnhup:
          files:
            /etc/cfn/cfn-hup.conf:
              mode: '000400'
              owner: root
              group: root
              content:
                Fn::Sub: |
                  [main]
                  stack=${AWS::StackId}
                  region=${AWS::Region}
                  interval=5
                  verbose=true
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              mode: '000400'
              owner: root
              group: root
              content:
                Fn::Sub: |
                  [cfn-auto-reloader-hook]
                  triggers=post.update
                  path=Resources.LaunchTemplate.Metadata.AWS::CloudFormation::Init
                  action=/usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource LaunchTemplate --region ${AWS::Region} --configsets default
                  runas=root
            # cfn-hup --no-daemon polls once and exits, so it is driven by a
            # timer (below) as a oneshot rather than a resident service. Run as
            # Type=simple with Restart=always it exited cleanly every launch and
            # systemd relaunched it on RestartSec, producing an endless restart
            # loop that spammed the journal. No [Install]/enable: the timer
            # activates the same-named .service when it elapses.
            /etc/systemd/system/cfn-hup.service:
              mode: '000644'
              owner: root
              group: root
              content: |
                [Unit]
                Description=cfn-hup (poll stack metadata once; scheduled by cfn-hup.timer)
                After=network-online.target
                Wants=network-online.target

                [Service]
                Type=oneshot
                ExecStart=/usr/local/bin/cfn-hup --no-daemon
            /etc/systemd/system/cfn-hup.timer:
              mode: '000644'
              owner: root
              group: root
              content: |
                [Unit]
                Description=Periodic cfn-hup poll for stack metadata changes

                [Timer]
                OnBootSec=2min
                OnUnitActiveSec=5min

                [Install]
                WantedBy=timers.target
          commands:
            01-daemon-reload:
              command: systemctl daemon-reload
            # Enable the timer; idempotent, so cfn-hup re-runs are safe. No need
            # to disable a prior resident cfn-hup.service: the unit is now a
            # oneshot with no Restart=always, so even a stale enablement symlink
            # just polls once at boot instead of restart-looping.
            02-enable-timer:
              command: systemctl enable --now cfn-hup.timer
        bootstrap:
          files:
            /opt/bootstrap/run.sh:
              mode: '000755'
              owner: root
              group: root
              content:
                Fn::Sub: |
                  #!/bin/bash
                  set -euxo pipefail
                  export DEBIAN_FRONTEND=noninteractive
                  export AWS_DEFAULT_REGION=${AWS::Region}

                  # --- Packages -------------------------------------------------
                  # steamcmd is a 32-bit binary, hence the i386 arch + lib32gcc.
                  # expect/telnet drive the console checks over the telnet console.
                  # jq parses the Servers parameter, which is the list of worlds
                  # this instance hosts.
                  dpkg --add-architecture i386
                  apt-get update -y
                  apt-get install -y --no-install-recommends \
                    lib32gcc-s1 expect telnet curl wget tar unzip ca-certificates jq

                  # Ubuntu 24.04 dropped the 'awscli' apt package, so install AWS CLI
                  # v2 from Amazon's official installer (arch-aware) at /usr/local/bin/aws.
                  if ! command -v aws >/dev/null 2>&1; then
                    case "$(uname -m)" in
                      aarch64) AWS_CLI_ARCH=aarch64 ;;
                      *)       AWS_CLI_ARCH=x86_64 ;;
                    esac
                    curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$AWS_CLI_ARCH.zip" -o /tmp/awscliv2.zip
                    unzip -q /tmp/awscliv2.zip -d /tmp
                    /tmp/aws/install
                    rm -rf /tmp/aws /tmp/awscliv2.zip
                  fi

                  # --- CloudWatch agent installer (invoked LAST, see call site) -
                  # Defined here but not run until the end of the bootstrap, so a
                  # metrics failure cannot abort the game install and, critically,
                  # the cwagent system user it creates is added only after sdtd's
                  # id is pinned. Each step short-circuits with an explicit return
                  # because set -e is suspended while the function is tested by the
                  # caller. Dimensions are $-bang escaped so Fn::Sub emits them
                  # literally for the agent to expand at runtime.
                  install_cloudwatch_agent() {
                    local arch=amd64
                    [ "$(uname -m)" = aarch64 ] && arch=arm64
                    if ! dpkg -s amazon-cloudwatch-agent >/dev/null 2>&1; then
                      curl -fsSL "https://amazoncloudwatch-agent.s3.amazonaws.com/ubuntu/$arch/latest/amazon-cloudwatch-agent.deb" -o /tmp/amazon-cloudwatch-agent.deb || return 1
                      dpkg -i -E /tmp/amazon-cloudwatch-agent.deb || return 1
                      rm -f /tmp/amazon-cloudwatch-agent.deb
                    fi
                    cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'CWAGENTCFG'
                  {
                    "agent": {
                      "metrics_collection_interval": 60,
                      "run_as_user": "root"
                    },
                    "metrics": {
                      "namespace": "7DaysServer",
                      "append_dimensions": {
                        "InstanceId": "${!aws:InstanceId}",
                        "InstanceType": "${!aws:InstanceType}",
                        "AutoScalingGroupName": "${!aws:AutoScalingGroupName}"
                      },
                      "aggregation_dimensions": [["AutoScalingGroupName"], ["InstanceId"]],
                      "metrics_collected": {
                        "mem": {
                          "measurement": ["mem_used_percent", "mem_used", "mem_available", "mem_total"]
                        },
                        "swap": {
                          "measurement": ["swap_used_percent"]
                        },
                        "disk": {
                          "measurement": ["used_percent"],
                          "resources": ["/", "/opt/games"],
                          "ignore_file_system_types": ["sysfs", "tmpfs", "devtmpfs", "overlay", "squashfs"]
                        },
                        "cpu": {
                          "measurement": ["cpu_usage_idle", "cpu_usage_user", "cpu_usage_system"],
                          "totalcpu": true
                        }
                      }
                    }
                  }
                  CWAGENTCFG
                    # fetch-config validates the JSON, installs the systemd unit, and
                    # (re)starts the agent; idempotent, so cfn-hup re-runs are safe.
                    /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                      -a fetch-config -m ec2 -s \
                      -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
                  }

                  # --- Instance identity (IMDSv2) -------------------------------
                  TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
                  IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

                  # --- Cross-stack values (read at boot, not baked into the template)
                  # The save volume and Elastic IP are created by sibling stacks and
                  # published as CloudFormation exports; read them via the CLI instead
                  # of wiring them in as Fn::Sub imports.
                  get_export() {
                    aws cloudformation list-exports \
                      --query "Exports[?Name=='$1'].Value" --output text
                  }
                  VOL_ID=$(get_export Seven-Days-Server-Disk)
                  ALLOC_ID=$(get_export Seven-Days-Server-Address)
                  PUBLIC_IP=$(get_export Seven-Days-Server-Address-IP)
                  if [ -z "$VOL_ID" ] || [ "$VOL_ID" = None ]; then
                    echo "ERROR: export Seven-Days-Server-Disk not found" >&2; exit 1
                  fi
                  if [ -z "$ALLOC_ID" ] || [ "$ALLOC_ID" = None ]; then
                    echo "ERROR: export Seven-Days-Server-Address not found" >&2; exit 1
                  fi
                  if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = None ]; then
                    echo "ERROR: export Seven-Days-Server-Address-IP not found" >&2; exit 1
                  fi
                  # Backup bucket (backup.yml). Non-fatal: a missing bucket only
                  # disables save backups, it must not block the game from
                  # starting. The 7dtd-backup script and spot-drain read the name
                  # from this env file, so both work however they are invoked.
                  BACKUP_BUCKET=$(get_export Seven-Days-Server-Backup-Bucket)
                  install -d -m 0755 /etc/7dtd
                  if [ -n "$BACKUP_BUCKET" ] && [ "$BACKUP_BUCKET" != None ]; then
                    printf 'BACKUP_BUCKET=%s\n' "$BACKUP_BUCKET" > /etc/7dtd/backup.env
                  else
                    rm -f /etc/7dtd/backup.env
                    echo "WARN: export Seven-Days-Server-Backup-Bucket not found; save backups disabled" >&2
                  fi

                  # --- Claim the Elastic IP -------------------------------------
                  # The ASG does not associate EIPs; do it ourselves. --allow-reassociation
                  # moves the address off any previous instance still releasing it.
                  # Every server on this host shares the address and is told apart
                  # by its port block.
                  for i in $(seq 1 12); do
                    if aws ec2 associate-address --allocation-id "$ALLOC_ID" --instance-id "$IID" --allow-reassociation >/dev/null 2>&1; then
                      break
                    fi
                    echo "waiting to associate EIP $ALLOC_ID (attempt $i)..." >&2
                    sleep 5
                  done

                  # --- Service user ---------------------------------------------
                  # Pin sdtd to a FIXED uid/gid. The save volume records ownership
                  # by numeric id, so sdtd must own the same id on every launch.
                  # Other system users created during boot (notably the CloudWatch
                  # agent's cwagent) would otherwise claim sdtd's auto-assigned
                  # --system id first and shift sdtd's, orphaning the game files.
                  # 1500 sits clear of the --system range and the AMI's ubuntu:1000.
                  # One user runs every server on the host: the worlds are isolated
                  # by userdata folder, not by uid.
                  getent group sdtd >/dev/null || groupadd --gid 1500 sdtd
                  id sdtd &>/dev/null || useradd --uid 1500 --gid 1500 --create-home --home-dir /home/sdtd --shell /usr/sbin/nologin sdtd

                  # --- Attach + mount the persistent save volume ----------------
                  # The ASG does not attach volumes; attach it to THIS instance and
                  # wait until the attachment sticks (survives a brief detach race if
                  # a previous instance is still releasing the volume).
                  for i in $(seq 1 60); do
                    if aws ec2 attach-volume --volume-id "$VOL_ID" --instance-id "$IID" --device /dev/sdf >/dev/null 2>&1; then
                      break
                    fi
                    cur=$(aws ec2 describe-volumes --volume-ids "$VOL_ID" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || true)
                    if [ "$cur" = "$IID" ]; then
                      break
                    fi
                    echo "waiting to attach $VOL_ID (attempt $i)..." >&2
                    sleep 5
                  done

                  # On Nitro instances the EBS volume shows up as an NVMe device with a
                  # non-deterministic name; the stable path is the by-id symlink keyed on
                  # the volume id (dashes stripped). Wait for it, then ONLY format when
                  # the volume has no filesystem - never reformat an existing save.
                  VOL_NODASH=$(echo "$VOL_ID" | tr -d -)
                  BYID="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$VOL_NODASH"
                  for i in $(seq 1 30); do [ -e "$BYID" ] && break; sleep 5; done
                  DEV=$(readlink -f "$BYID")
                  mkdir -p /opt/games
                  if ! blkid "$DEV"; then
                    mkfs.ext4 -L 7dtd "$DEV"
                  fi
                  UUID=$(blkid -s UUID -o value "$DEV")
                  grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /opt/games ext4 defaults,noatime,nofail 0 2" >> /etc/fstab
                  mount -a

                  # --- SteamCMD + 7 Days to Die (dedicated server app 294420) ---
                  # ONE install serves every world on this host: 7DTD takes
                  # -configfile and -userdatafolder per process, so the worlds are
                  # isolated by save folder rather than by a duplicated 15 GB of
                  # game files. SteamCMD and the game live on the persistent save
                  # volume, so a fresh ASG instance reuses the existing copy instead
                  # of reinstalling: only extract SteamCMD when it is missing, and
                  # skip the full `validate` re-hash once the app manifest exists (a
                  # first install validates; later boots just run app_update to pick
                  # up patches, and SteamCMD resumes an interrupted update from its
                  # own manifest). On a fresh extract SteamCMD self-updates on first
                  # run; that first invocation can fail with "Failed to install app
                  # ... (Missing configuration)" before the client is bootstrapped,
                  # so retry (up to 5 attempts) rather than letting set -e abort the
                  # whole bootstrap on a transient first-run failure.
                  mkdir -p /opt/games/steamcmd /opt/games/7days /opt/games/userdata
                  # Recursive: reclaim any files a prior launch wrote under a
                  # since-shifted uid (see the fixed-id note above), so steamcmd
                  # running as sdtd can always write the whole game tree.
                  chown -R sdtd:sdtd /opt/games
                  if [ -f /opt/games/7days/steamapps/appmanifest_294420.acf ]; then VALIDATE=""; else VALIDATE="validate"; fi
                  sudo -u sdtd bash -s -- "$VALIDATE" <<'STEAMCMD'
                  set -eux
                  VALIDATE="$1"
                  cd /opt/games/steamcmd
                  if [ ! -x ./steamcmd.sh ]; then
                    curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -
                  fi
                  n=0
                  until ./steamcmd.sh +force_install_dir /opt/games/7days +login anonymous +app_update 294420 $VALIDATE +quit; do
                    n=$((n+1))
                    if [ "$n" -ge 5 ]; then
                      echo "ERROR: steamcmd app_update 294420 failed after $n attempts" >&2
                      exit 1
                    fi
                    echo "steamcmd app_update failed (attempt $n), retrying in 15s..." >&2
                    sleep 15
                  done
                  STEAMCMD

                  # --- Server region (EOS server-browser matchmaking) ----------
                  # 7DTD's Region property buckets the server into one of ten
                  # fixed matchmaking geographies; map the AWS region we launched
                  # in to the closest one. The three Oceania ap-southeast zones
                  # (Sydney/Melbourne/Auckland) are matched before the general
                  # ap-*/cn-* -> Asia fallthrough. Unknown/new regions default to
                  # NorthAmericaEast.
                  case "$AWS_DEFAULT_REGION" in
                    ap-southeast-2|ap-southeast-4|ap-southeast-6) SERVER_REGION=Oceania ;;
                    us-east-*|us-gov-east-*|ca-central-*)         SERVER_REGION=NorthAmericaEast ;;
                    us-west-*|us-gov-west-*|ca-west-*)            SERVER_REGION=NorthAmericaWest ;;
                    mx-*)                                         SERVER_REGION=CentralAmerica ;;
                    sa-*)                                         SERVER_REGION=SouthAmerica ;;
                    eu-*)                                         SERVER_REGION=Europe ;;
                    me-*|il-*)                                    SERVER_REGION=MiddleEast ;;
                    af-*)                                         SERVER_REGION=Africa ;;
                    ap-*|cn-*)                                    SERVER_REGION=Asia ;;
                    *)                                            SERVER_REGION=NorthAmericaEast ;;
                  esac

                  # --- The server set -------------------------------------------
                  # Servers is a JSON array, one object per world this host runs.
                  # Every field except Slug is optional and falls back to the
                  # matching stack parameter, so [{"Slug":"main"}] is a single
                  # server configured entirely from the top-level parameters.
                  # Written through a quoted heredoc so no operator-supplied text
                  # is ever re-parsed by the shell.
                  cat > /run/7dtd-servers.json <<'SERVERSJSON'
                  ${Servers}
                  SERVERSJSON
                  if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "object")' /run/7dtd-servers.json >/dev/null 2>&1; then
                    echo "ERROR: the Servers parameter must be a non-empty JSON array of objects" >&2
                    exit 1
                  fi
                  SERVER_COUNT=$(jq 'length' /run/7dtd-servers.json)

                  # Stack-level defaults every record inherits for the fields it
                  # does not set. One Name=Value per line: a CloudFormation String
                  # parameter cannot contain a newline, so the first = always
                  # splits correctly, and a value may itself contain =. Mode 0600
                  # because the two passwords are in here; deleted at the end.
                  install -m 0600 /dev/null /run/7dtd-defaults
                  cat > /run/7dtd-defaults <<'DEFAULTS'
                  ServerName=${ServerName}
                  ServerDescription=${ServerDescription}
                  ServerWebsiteURL=${ServerWebsiteURL}
                  ServerVisibility=${ServerVisibility}
                  ServerMaxPlayerCount=${ServerMaxPlayerCount}
                  ServerReservedSlots=${ServerReservedSlots}
                  ServerReservedSlotsPermission=${ServerReservedSlotsPermission}
                  GameWorld=${GameWorld}
                  GameName=${GameName}
                  WorldGenSeed=${WorldGenSeed}
                  WorldGenSize=${WorldGenSize}
                  SandboxCode=${SandboxCode}
                  PlayerKillingMode=${PlayerKillingMode}
                  AdminSteamIds=${AdminSteamIds}
                  AdminPermissionLevel=${AdminPermissionLevel}
                  ServerPropertyOverrides=${ServerPropertyOverrides}
                  GamePassword=${GamePassword}
                  AdminPassword=${AdminPassword}
                  DEFAULTS

                  # def_get <field>: the stack-parameter default for that field.
                  def_get() {
                    sed -n "s/^$1=//p" /run/7dtd-defaults | head -n1
                  }
                  # srv_get <index> <field>: that server's value, or the default.
                  # jq's // treats only null and false as absent, so a numeric 0
                  # (AdminPermissionLevel, PlayerKillingMode) is kept, not replaced.
                  # Always newline-terminated: the callers that redirect this to
                  # a file feed it to `read`, which silently drops a trailing
                  # line that has no newline - and that line is the last Steam id
                  # or the last property override.
                  srv_get() {
                    local v
                    v=$(jq -r --argjson i "$1" --arg f "$2" '.[$i][$f] // empty' /run/7dtd-servers.json)
                    if [ -n "$v" ]; then printf '%s\n' "$v"; else def_get "$2"; fi
                  }

                  # --- Port allocation ------------------------------------------
                  # Ports come from the record's index, not from the record, so
                  # they cannot be set into a collision by hand: 7DTD claims
                  # ServerPort..ServerPort+3, so each world takes a block of 4 from
                  # PortNumber, and one port each from the telnet and dashboard
                  # bases. CloudFormation cannot count the entries of a JSON string
                  # parameter, so the security group's range stays operator-set
                  # (PortNumber..PortNumberTop) and is checked here instead: a world
                  # whose ports the group does not open would appear in the browser
                  # and refuse every connection, which is worse than not booting.
                  : > /run/7dtd-manifest
                  i=0
                  while [ "$i" -lt "$SERVER_COUNT" ]; do
                    slug=$(jq -r --argjson i "$i" '.[$i].Slug // empty' /run/7dtd-servers.json)
                    # The slug is both a path component and a systemd instance
                    # name, so it is held to characters neither needs escaped.
                    if ! printf '%s' "$slug" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$'; then
                      echo "ERROR: Servers[$i].Slug '$slug' must be 1-32 characters of [A-Za-z0-9_-] starting with a letter or digit" >&2
                      exit 1
                    fi
                    game_port=$(( ${PortNumber} + i * 4 ))
                    telnet_port=$(( ${TelnetPort} + i ))
                    dash_port=$(( ${WebDashboardPort} + i ))
                    if [ "$(( game_port + 3 ))" -gt "${PortNumberTop}" ]; then
                      echo "ERROR: server '$slug' needs game ports $game_port-$(( game_port + 3 )) but the security group only opens ${PortNumber}-${PortNumberTop}. Raise PortNumberTop to at least $(( game_port + 3 ))." >&2
                      exit 1
                    fi
                    printf '%s %s %s %s %s\n' "$i" "$slug" "$game_port" "$telnet_port" "$dash_port" >> /run/7dtd-manifest
                    i=$(( i + 1 ))
                  done
                  dupe_slugs=$(awk '{print $2}' /run/7dtd-manifest | sort | uniq -d)
                  if [ -n "$dupe_slugs" ]; then
                    echo "ERROR: duplicate Slug in the Servers parameter: $dupe_slugs" >&2
                    exit 1
                  fi
                  # Every port this host will bind, game blocks included. Catches a
                  # TelnetPort or WebDashboardPort base that the growing ranges walk
                  # into as servers are added.
                  dupe_ports=$(awk '{print $3; print $3+1; print $3+2; print $3+3; print $4; print $5}' /run/7dtd-manifest | sort -n | uniq -d)
                  if [ -n "$dupe_ports" ]; then
                    echo "ERROR: port collision across servers on $(echo "$dupe_ports" | tr '\n' ' '). Move TelnetPort and WebDashboardPort clear of each other and of the game port range." >&2
                    exit 1
                  fi
                  awk '{print $2}' /run/7dtd-manifest > /etc/7dtd/servers

                  # --- Per-server config, save folder and console credentials ----
                  # xtrace is off for this whole section: it would print the game
                  # and telnet passwords into the cloud-init log on every launch.
                  # Progress is echoed explicitly instead.
                  set +x
                  game_pw=$(def_get GamePassword)
                  # An SSM parameter cannot hold an empty string, so the literal
                  # text 'none' in the parameter that GamePassword names is how the
                  # operator asks for an open server.
                  if [ "$game_pw" = none ]; then game_pw=""; fi
                  admin_pw=$(def_get AdminPassword)

                  # Appends one property to the config being written. printf, not a
                  # heredoc, so an operator-supplied value is never re-parsed on its
                  # way into the XML. As before, the value must be XML-safe.
                  xml_prop() {
                    printf '  <property name="%s" value="%s"/>\n' "$1" "$2" >> "$CFG"
                  }
                  # ServerPropertyOverrides reaches every property without a
                  # parameter of its own. Each pair replaces that property where
                  # this template already writes it, and is appended where it does
                  # not - so properties this template has never heard of can be set.
                  set_property() {
                    local name="$1" value="$2" esc
                    if grep -q "<property name=\"$name\" " "$CFG"; then
                      # Escape what sed reads specially in a replacement: backslash,
                      # & (the whole match) and the | delimiter.
                      esc=$(printf '%s' "$value" | sed -e 's/[\\&|]/\\&/g')
                      sed -i "s|<property name=\"$name\" value=\"[^\"]*\"/>|<property name=\"$name\" value=\"$esc\"/>|" "$CFG"
                      echo "serverconfig[$SLUG]: set $name" >&2
                    else
                      printf '  <property name="%s" value="%s"/>\n' "$name" "$value" >> "$CFG"
                      echo "serverconfig[$SLUG]: added $name" >&2
                    fi
                  }

                  while read -r idx slug game_port telnet_port dash_port; do
                    SLUG=$slug
                    SRV_DIR=/etc/7dtd/$slug
                    CFG=$SRV_DIR/serverconfig.xml
                    USERDATA=/opt/games/userdata/$slug
                    srv_name=$(srv_get "$idx" ServerName)
                    echo "configuring server '$slug' ($srv_name) on game $game_port, telnet $telnet_port, dashboard $dash_port" >&2
                    install -d -m 0755 "$SRV_DIR"
                    # The game creates Saves/ itself, but serveradmin.xml has to be
                    # in place before the first launch.
                    install -d -o sdtd -g sdtd "$USERDATA"
                    install -d -o sdtd -g sdtd "$USERDATA/Saves"

                    # Rewritten on every launch: under the ASG the template is the
                    # source of truth, so config never drifts from what is deployed.
                    # The join and console passwords are in here, so it is readable
                    # only by root and the game process that must read it.
                    install -m 0640 -o root -g sdtd /dev/null "$CFG"
                    echo '<?xml version="1.0"?>' >> "$CFG"
                    echo '<ServerSettings>' >> "$CFG"
                    xml_prop ServerIP "$PUBLIC_IP"
                    xml_prop ServerPort "$game_port"
                    xml_prop ServerVisibility "$(srv_get "$idx" ServerVisibility)"
                    xml_prop ServerName "$srv_name"
                    xml_prop Region "$SERVER_REGION"
                    xml_prop ServerPassword "$game_pw"
                    xml_prop ServerDescription "$(srv_get "$idx" ServerDescription)"
                    xml_prop ServerWebsiteURL "$(srv_get "$idx" ServerWebsiteURL)"
                    xml_prop ServerMaxPlayerCount "$(srv_get "$idx" ServerMaxPlayerCount)"
                    xml_prop ServerReservedSlots "$(srv_get "$idx" ServerReservedSlots)"
                    xml_prop ServerReservedSlotsPermission "$(srv_get "$idx" ServerReservedSlotsPermission)"
                    xml_prop ServerAdminSlots 0
                    xml_prop ServerAdminSlotsPermission 0
                    xml_prop ServerDisabledNetworkProtocols ""
                    xml_prop ServerMaxWorldTransferSpeedKiBs 1024
                    xml_prop ServerAllowCrossplay false
                    xml_prop EACEnabled false
                    xml_prop IgnoreEOSSanctions false

                    xml_prop WebDashboardEnabled "${WebDashboardEnabled}"
                    xml_prop WebDashboardPort "$dash_port"
                    xml_prop WebDashboardUrl ""
                    # Off: tile rendering writes to the save volume on every
                    # explored chunk, and only the web dashboard map reads the
                    # tiles. Set true per server via ServerPropertyOverrides if
                    # you want that map.
                    xml_prop EnableMapRendering false

                    xml_prop TelnetEnabled true
                    xml_prop TelnetPort "$telnet_port"
                    xml_prop TelnetPassword "$admin_pw"
                    xml_prop TelnetFailedLoginLimit 10
                    xml_prop TelnetFailedLoginsBlocktime 300
                    xml_prop TerminalWindowEnabled false

                    xml_prop AdminFileName serveradmin.xml

                    xml_prop GameWorld "$(srv_get "$idx" GameWorld)"
                    xml_prop WorldGenSeed "$(srv_get "$idx" WorldGenSeed)"
                    xml_prop WorldGenSize "$(srv_get "$idx" WorldGenSize)"
                    xml_prop GameName "$(srv_get "$idx" GameName)"
                    xml_prop GameMode GameModeSurvival

                    # V3.0: difficulty, zombie speed, loot, blood moon, day length,
                    # drop-on-death, air drops, etc. are all encoded in SandboxCode.
                    xml_prop SandboxCode "$(srv_get "$idx" SandboxCode)"

                    xml_prop PlayerKillingMode "$(srv_get "$idx" PlayerKillingMode)"
                    xml_prop PersistentPlayerProfiles false
                    xml_prop PlayerSafeZoneLevel 5
                    xml_prop PlayerSafeZoneHours 5
                    xml_prop BedrollDeadZoneSize 15
                    xml_prop PartySharedKillRange 100

                    xml_prop LandClaimSize 41
                    xml_prop LandClaimDeadZone 30
                    xml_prop LandClaimExpiryTime 3
                    xml_prop LandClaimDecayMode 0
                    xml_prop LandClaimOnlineDurabilityModifier 4
                    xml_prop LandClaimOfflineDurabilityModifier 4

                    xml_prop DynamicMeshEnabled true
                    xml_prop DynamicMeshLandClaimOnly true
                    xml_prop DynamicMeshLandClaimBuffer 3
                    xml_prop DynamicMeshMaxItemCache 3

                    # Per-server caps: N servers on one host multiply these, so cut
                    # them down through ServerPropertyOverrides as servers are added.
                    xml_prop MaxSpawnedZombies 64
                    xml_prop MaxSpawnedAnimals 64
                    xml_prop MaxUncoveredMapChunksPerPlayer 131072
                    xml_prop HideCommandExecutionLog 3

                    # This server's overrides, applied while the document is still
                    # open so an appended property needs no rewriting to land.
                    srv_get "$idx" ServerPropertyOverrides > /run/7dtd-property-overrides
                    while IFS= read -r kv; do
                      # Skip blanks and anything without a Name=Value shape.
                      case "$kv" in
                        *=*) ;;
                        *) continue ;;
                      esac
                      ov_name=$(printf '%s' "${!kv%%=*}" | tr -d '[:space:]')
                      # Split on the FIRST = only, so a value may itself contain one.
                      ov_value=$(printf '%s' "${!kv#*=}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
                      [ -n "$ov_name" ] || continue
                      # Ports belong to the record's index, not to the record.
                      # Honouring an override here would silently move this
                      # server onto a neighbour's port, or outside the range the
                      # security group opens - neither of which the checks above
                      # can see, because they run before this.
                      case "$ov_name" in
                        ServerPort|TelnetPort|WebDashboardPort)
                          echo "ERROR: server '$slug' sets $ov_name through ServerPropertyOverrides. Ports are allocated from the server's position in the Servers list; change PortNumber, TelnetPort or WebDashboardPort instead." >&2
                          exit 1
                          ;;
                      esac
                      set_property "$ov_name" "$ov_value"
                    done < <(tr ',' '\n' < /run/7dtd-property-overrides)
                    rm -f /run/7dtd-property-overrides

                    # Every property is in place; close the document.
                    echo '</ServerSettings>' >> "$CFG"

                    # --- Admin permissions (serveradmin.xml) --------------------
                    # AdminFileName resolves relative to the SaveGameFolder, which
                    # is <userdatafolder>/Saves - NOT the userdata root. Written at
                    # the root the game never reads it and writes its own default.
                    # Rewritten on every launch for the same reason as the config,
                    # which means in-game ban/whitelist edits do not survive a
                    # relaunch. 1.0+ schema: <user platform= userid=
                    # permission_level= />, where a LOWER level means MORE power
                    # (0 = full, 1000 = default player). Empty by default: a fresh
                    # deployment has no admins until its owner names Steam ids.
                    srv_get "$idx" AdminSteamIds > /run/7dtd-admin-ids
                    admin_level=$(srv_get "$idx" AdminPermissionLevel)
                    {
                      echo '<?xml version="1.0"?>'
                      echo '<adminTools>'
                      echo '  <users>'
                      while IFS= read -r steam_id; do
                        steam_id=$(printf '%s' "$steam_id" | tr -d '[:space:]')
                        [ -n "$steam_id" ] || continue
                        printf '    <user platform="Steam" userid="%s" permission_level="%s" />\n' \
                          "$steam_id" "$admin_level"
                      done < <(tr ',' '\n' < /run/7dtd-admin-ids)
                      echo '  </users>'
                      echo '  <permissions>'
                      echo '  </permissions>'
                      echo '  <whitelist>'
                      echo '  </whitelist>'
                      echo '  <blacklist>'
                      echo '  </blacklist>'
                      echo '</adminTools>'
                    } > "$USERDATA/Saves/serveradmin.xml"
                    rm -f /run/7dtd-admin-ids
                    chown sdtd:sdtd "$USERDATA/Saves/serveradmin.xml"

                    # Read by every supervision script, so each knows which console
                    # to talk to and which address to name in a notification. The
                    # name is %q-quoted because it usually contains spaces and these
                    # files are sourced by bash, not parsed by systemd.
                    {
                      printf 'SLUG=%s\n' "$slug"
                      printf 'GAME_PORT=%s\n' "$game_port"
                      printf 'TELNET_PORT=%s\n' "$telnet_port"
                      printf 'DASH_PORT=%s\n' "$dash_port"
                      printf 'USERDATA=%s\n' "$USERDATA"
                      printf 'CONFIG=%s\n' "$CFG"
                      printf 'SERVER_NAME=%q\n' "$srv_name"
                    } > "$SRV_DIR/server.env"
                    chmod 0644 "$SRV_DIR/server.env"
                  done < /run/7dtd-manifest
                  set -x
                  # Both passwords are in the defaults file and nothing past this
                  # point reads it, or the manifest. /etc/7dtd/servers and the
                  # per-server server.env files are what the running host uses.
                  rm -f /run/7dtd-defaults /run/7dtd-servers.json /run/7dtd-manifest

                  # cfn-hup re-runs this bootstrap in place, so a world dropped from
                  # the Servers parameter would otherwise keep running as an orphan
                  # nothing supervises. Its units are stopped and its config removed;
                  # its save data under /opt/games/userdata is deliberately left
                  # alone, so putting the record back resumes the same world.
                  for d in /etc/7dtd/*/; do
                    [ -d "$d" ] || continue
                    old=$(basename "$d")
                    grep -qx "$old" /etc/7dtd/servers && continue
                    echo "server '$old' is no longer in the Servers parameter; stopping its units" >&2
                    systemctl disable --now "7dtd@$old.service" 2>/dev/null || true
                    systemctl disable --now "7dtd-login-notify@$old.service" 2>/dev/null || true
                    rm -rf "$d"
                  done
                  # Same problem one version back: a host bootstrapped before the
                  # units were templated is running a plain 7dtd.service still
                  # holding the game port, so 7dtd@<slug> could never bind. The
                  # stop-notify unit is deliberately NOT touched here - stopping
                  # it fires its ExecStop and emails a shutdown that is not
                  # happening.
                  for stale in 7dtd.service 7dtd-login-notify.service; do
                    [ -f "/etc/systemd/system/$stale" ] || continue
                    echo "stopping $stale, replaced by its templated form" >&2
                    systemctl disable --now "$stale" 2>/dev/null || true
                    rm -f "/etc/systemd/system/$stale"
                  done
                  systemctl daemon-reload

                  # --- Telnet console reader ------------------------------------
                  # Connects to one server's telnet console and runs listplayers;
                  # used by the idle, self-heal and daily-refresh checks. Takes the
                  # port so a single copy serves every server on the host.
                  cat > /usr/local/bin/7dtd-listplayers <<'LISTPLAYERS'
                  #!/usr/bin/expect
                  set timeout 20
                  set port [lindex $argv 0]
                  spawn telnet localhost $port
                  expect -re "Please enter password:"
                  send "${AdminPassword}\r"
                  expect -re "end session."
                  send "listplayers\r"
                  expect -re "in the game"
                  send "exit\r"
                  # Wait for the server to close the socket (EOF) instead of
                  # tearing it down on script exit; slamming it shut mid-write
                  # makes the server log an IOException on its telnet thread.
                  expect eof
                  LISTPLAYERS
                  # 0700, not 0755: this file carries the console password, and the
                  # game itself runs as sdtd. Every caller (the idle, health, drain
                  # and login-notify units) runs as root.
                  chmod 0700 /usr/local/bin/7dtd-listplayers

                  # --- Generic telnet console command runner --------------------
                  # 7dtd-console <port> <command>: sends a single arbitrary command
                  # to one server's console; used by the backup and the spot drain
                  # to issue saveworld / say.
                  cat > /usr/local/bin/7dtd-console <<'CONSOLE'
                  #!/usr/bin/expect
                  set timeout 20
                  set port [lindex $argv 0]
                  set cmd [lindex $argv 1]
                  spawn telnet localhost $port
                  expect -re "Please enter password:"
                  send "${AdminPassword}\r"
                  expect -re "end session."
                  send "$cmd\r"
                  sleep 2
                  send "exit\r"
                  expect eof
                  CONSOLE
                  # Carries the console password; root-only, as above.
                  chmod 0700 /usr/local/bin/7dtd-console

                  # --- Save backup to S3 ----------------------------------------
                  # For every server: flush the live world to disk (saveworld), tar
                  # that world's userdata folder (Saves, generated world,
                  # serveradmin.xml) plus its serverconfig, and upload a
                  # date-stamped archive under its own prefix. Run periodically by
                  # a timer and once on a spot reclaim. The world save is a small
                  # subset of the volume, so this file-level archive is far cheaper
                  # than a whole-volume snapshot and is portable (downloadable,
                  # restorable anywhere). Retention is handled by the bucket's
                  # lifecycle rule, not here. One server failing to archive does not
                  # stop the others; the exit status reports that anything failed.
                  cat > /usr/local/bin/7dtd-backup <<'BACKUP'
                  #!/bin/bash
                  set -uo pipefail
                  export AWS_DEFAULT_REGION=${AWS::Region}
                  [ -f /etc/7dtd/backup.env ] && . /etc/7dtd/backup.env
                  if [ -z "${!BACKUP_BUCKET:-}" ]; then
                    echo "backup: BACKUP_BUCKET unset; skipping" >&2
                    exit 0
                  fi
                  STAMP=$(date -u +%Y-%m-%d_%H%M%S)
                  rc=0
                  for slug in $(cat /etc/7dtd/servers); do
                    . "/etc/7dtd/$slug/server.env"
                    DEST="s3://$BACKUP_BUCKET/saves/$slug/7dtd-$STAMP.tar.gz"
                    # Flush to disk first so the archive is consistent. If the
                    # console is unreachable (server down) we still archive whatever
                    # is on disk - a slightly stale save beats no save.
                    if ! /usr/local/bin/7dtd-console "$TELNET_PORT" "saveworld" >/dev/null 2>&1; then
                      echo "backup[$slug]: saveworld console unreachable; archiving on-disk state" >&2
                    fi
                    sleep 3
                    TMP=$(mktemp /opt/games/7dtd-backup.XXXXXX.tar.gz)
                    if ! tar czf "$TMP" -C /opt/games "userdata/$slug" -C /etc/7dtd "$slug/serverconfig.xml"; then
                      echo "backup[$slug]: ERROR tar failed" >&2
                      rc=1
                    elif ! aws s3 cp "$TMP" "$DEST"; then
                      echo "backup[$slug]: ERROR upload to $DEST failed" >&2
                      rc=1
                    else
                      echo "backup[$slug]: uploaded $DEST" >&2
                    fi
                    rm -f "$TMP"
                  done
                  exit $rc
                  BACKUP
                  chmod 0755 /usr/local/bin/7dtd-backup

                  # --- Notification helper --------------------------------------
                  # 7dtd-notify <subject> <body> [port]: the single SNS publish path
                  # for every notification (server up, host shutting down, player
                  # joined), so the topic and the message shape live in one place.
                  # The port names which world on this host the message is about;
                  # without one the message just carries the shared Elastic IP,
                  # which is what a host-level shutdown wants. SNS requires an ASCII
                  # subject with no control characters, under 100 chars, so it is
                  # stripped and truncated rather than losing the notification to a
                  # rejected publish (the body keeps the text as-is - message bodies
                  # are UTF-8 clean). The strip runs under LC_ALL=C deliberately: tr
                  # works on bytes, and in a UTF-8 locale [:alnum:] matches accented
                  # letters, so their multi-byte encodings would survive into a
                  # subject SNS then rejects. Always exits 0: a failed publish is
                  # logged, never propagated, because no caller of this helper
                  # should change what it does just because an email did not go out.
                  cat > /usr/local/bin/7dtd-notify <<'NOTIFY'
                  #!/bin/bash
                  export AWS_DEFAULT_REGION=${AWS::Region}
                  TOPIC="${NotifyTopic}"
                  subject=$(printf '%s' "$1" | LC_ALL=C tr -cd '[:alnum:] :_.,-' | cut -c1-100)
                  [ -n "$subject" ] || subject="7DTD"
                  port="${!3:-}"
                  if [ -n "$port" ]; then addr="__PUBLIC_IP__:$port"; else addr="__PUBLIC_IP__"; fi
                  if aws sns publish --topic-arn "$TOPIC" --subject "$subject" \
                    --message "$2
                  Server: $addr" >/dev/null; then
                    echo "notify: sent '$subject'" >&2
                  else
                    echo "notify: ERROR publish failed for '$subject'" >&2
                  fi
                  exit 0
                  NOTIFY
                  # Same placeholder trick as the config: the heredoc is
                  # single-quoted, so the Elastic IP is dropped in afterwards.
                  sed -i -e "s/__PUBLIC_IP__/$PUBLIC_IP/" /usr/local/bin/7dtd-notify
                  chmod 0755 /usr/local/bin/7dtd-notify

                  # --- Telnet console log stream --------------------------------
                  # The telnet console streams the server's live log to every
                  # connected client, so this is a long-lived login + read-forever
                  # session that prints that stream on stdout for the login watcher
                  # below to filter. Reading the log this way (rather than the
                  # game's own timestamped output_log_dedi__*.txt, which gets a new
                  # name on every launch) keeps it on the same console the idle and
                  # health checks already rely on. `timeout -1` after the login
                  # blocks forever; when the server goes away the socket closes and
                  # the script exits, and systemd reconnects.
                  cat > /usr/local/bin/7dtd-log-stream <<'LOGSTREAM'
                  #!/usr/bin/expect
                  # stdout here is a pipe into the login watcher, not a tty. Tcl
                  # chooses its buffering per channel type, so pin it off: block
                  # buffering would hold log lines back until several KB had
                  # accumulated, and on a quiet server that stalls a login email
                  # for as long as the server stays quiet.
                  fconfigure stdout -buffering none
                  set timeout 20
                  set port [lindex $argv 0]
                  spawn telnet localhost $port
                  expect -re "Please enter password:"
                  send "${AdminPassword}\r"
                  expect -re "end session."
                  set timeout -1
                  expect eof
                  LOGSTREAM
                  # Carries the console password; root-only, as above.
                  chmod 0700 /usr/local/bin/7dtd-log-stream

                  # --- Player login notifications -------------------------------
                  # 7dtd-login-notify <slug>: filters one server's console log
                  # stream and publishes to the SNS topic on each join. 7DTD emits
                  # exactly one global message per login:
                  #   ... INF GMSG: Player 'SomePlayer' joined the game
                  # so that line is the event - one email per login, and leaves are
                  # deliberately ignored. Only matched lines are ever echoed, so the
                  # raw stream (which carries the console password exchange) never
                  # reaches the journal. The subject names the world, because a host
                  # running several of them is otherwise ambiguous.
                  cat > /usr/local/bin/7dtd-login-notify <<'LOGINNOTIFY'
                  #!/bin/bash
                  set -u
                  slug="$1"
                  . "/etc/7dtd/$slug/server.env"
                  # No filter between the stream and the loop: any extra stage
                  # (tr, grep, sed) would block-buffer the pipe and sit on lines.
                  # The console's trailing CR is harmless - it lands outside the
                  # quoted player name the match below extracts.
                  /usr/local/bin/7dtd-log-stream "$TELNET_PORT" | while IFS= read -r line; do
                    case "$line" in
                      # Chat is echoed to the console too, so a player could type a
                      # fake join line; drop chat before matching anything.
                      *"Chat ("*) continue ;;
                      *"INF GMSG: Player "*"joined the game"*) ;;
                      *) continue ;;
                    esac
                    player=$(printf '%s' "$line" | sed -n "s/.*INF GMSG: Player '\(.*\)' joined the game.*/\1/p")
                    [ -n "$player" ] || player=unknown
                    when=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
                    /usr/local/bin/7dtd-notify "7DTD $SERVER_NAME: $player joined the game" \
                      "$player joined $SERVER_NAME at $when." "$GAME_PORT"
                  done
                  LOGINNOTIFY
                  chmod 0755 /usr/local/bin/7dtd-login-notify

                  # --- Idle check (scale the ASG to zero) -----------------------
                  # Reads listplayers on EVERY server and scales the ASG to zero
                  # (terminate THIS instance + decrement desired capacity) only once
                  # the whole host has been positively empty for a continuous grace
                  # window (IdleGraceMinutes) - so a brief lull does not tear the
                  # server down, and one busy world keeps every other world up. The
                  # "empty since" timestamp lives on tmpfs (/run) so it resets each
                  # launch. Any player anywhere clears it; a single unreachable
                  # console abandons the check entirely, leaving the window
                  # untouched (a transient telnet blip must not reset it) and never
                  # triggering a scale-down - so a host is also never scaled down
                  # before its servers have started.
                  cat > /usr/local/bin/7dtd-idle-check <<'IDLECHECK'
                  #!/bin/bash
                  export AWS_DEFAULT_REGION=${AWS::Region}
                  STATE=/run/7dtd-idle
                  EMPTY_SINCE="$STATE/empty_since"
                  GRACE=$(( ${IdleGraceMinutes} * 60 ))
                  mkdir -p "$STATE"
                  total=0
                  for slug in $(cat /etc/7dtd/servers); do
                    . "/etc/7dtd/$slug/server.env"
                    output=$(/usr/local/bin/7dtd-listplayers "$TELNET_PORT" 2>/dev/null || true)
                    number=$(echo "$output" | grep "in the game" | grep -Eo "[0-9]+" | head -1)
                    if [ -z "$number" ]; then
                      echo "idle: no player count from '$slug'; leaving the empty window as-is" >&2
                      exit 0
                    fi
                    total=$(( total + number ))
                  done
                  if [ "$total" -gt 0 ]; then
                    rm -f "$EMPTY_SINCE"
                    exit 0
                  fi
                  # Positively empty everywhere: start the grace clock on the first
                  # empty read.
                  now=$(date +%s)
                  [ -f "$EMPTY_SINCE" ] || echo "$now" > "$EMPTY_SINCE"
                  since=$(cat "$EMPTY_SINCE" 2>/dev/null || echo "$now")
                  elapsed=$((now - since))
                  if [ "$elapsed" -lt "$GRACE" ]; then
                    echo "7dtd all servers empty for $elapsed s of $GRACE s grace; not scaling down yet" >&2
                    exit 0
                  fi
                  echo "7dtd all servers empty for $elapsed s (>= $GRACE s grace); scaling ASG to zero" >&2
                  # Leave the reason for the shutdown notification that follows.
                  mkdir -p /run/7dtd-notify
                  echo "no players on any server for $((elapsed / 60)) minutes, so it idle-stopped itself" > /run/7dtd-notify/stop_reason
                  TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                  IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                  aws autoscaling terminate-instance-in-auto-scaling-group \
                    --instance-id "$IID" --should-decrement-desired-capacity
                  IDLECHECK
                  chmod 0755 /usr/local/bin/7dtd-idle-check

                  # --- Self-heal check (recover a wedged game process) ----------
                  # Per server: if its console was reachable earlier this boot but
                  # has since stopped responding for THRESHOLD consecutive checks,
                  # restart that server's unit. Replacing the whole instance would
                  # evict every other world's players, so it is the escalation
                  # rather than the first move: only if the server is still silent
                  # THRESHOLD checks after its restart is the instance marked
                  # Unhealthy for the ASG to replace. Fail-safe: nothing happens
                  # until a server has been healthy at least once this boot (state
                  # lives on tmpfs /run so it resets each launch), which prevents
                  # killing a slow first boot / world-gen. Dead hosts are handled
                  # underneath by the ASG's EC2 status-check health type.
                  #
                  # This check also owns the server-up notification: the moment a
                  # console first answers is the moment that world is loaded and
                  # joinable, which is exactly what its ready mark records - so the
                  # email is sent where that mark is created, once per server per
                  # boot, and needs no extra polling or log parsing of its own. The
                  # cost is latency: up to one timer interval (HealthCheckMinutes).
                  cat > /usr/local/bin/7dtd-health-check <<'HEALTHCHECK'
                  #!/bin/bash
                  export AWS_DEFAULT_REGION=${AWS::Region}
                  THRESHOLD=${HealthCheckFailureThreshold}
                  mark_unhealthy() {
                    TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                    IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                    echo "health: $1; marking $IID Unhealthy" >&2
                    # Leave the reason for the shutdown notification that follows
                    # once the ASG acts on the Unhealthy mark and terminates.
                    mkdir -p /run/7dtd-notify
                    echo "$1, so the instance was marked unhealthy and is being replaced" > /run/7dtd-notify/stop_reason
                    aws autoscaling set-instance-health --instance-id "$IID" --health-status Unhealthy
                  }
                  for slug in $(cat /etc/7dtd/servers); do
                    . "/etc/7dtd/$slug/server.env"
                    STATE=/run/7dtd-health/$slug
                    mkdir -p "$STATE"
                    output=$(/usr/local/bin/7dtd-listplayers "$TELNET_PORT" 2>/dev/null || true)
                    if echo "$output" | grep -q "in the game"; then
                      echo 0 > "$STATE/fails"
                      rm -f "$STATE/restarted"
                      if [ ! -f "$STATE/was_healthy" ]; then
                        /usr/local/bin/7dtd-notify "7DTD $SERVER_NAME: server is up" \
                          "$SERVER_NAME has finished loading and is ready to join." "$GAME_PORT"
                      fi
                      touch "$STATE/was_healthy"
                      continue
                    fi
                    # Unreachable: ignore entirely until it has been healthy once.
                    [ -f "$STATE/was_healthy" ] || continue
                    fails=$(cat "$STATE/fails" 2>/dev/null || echo 0)
                    fails=$((fails+1))
                    echo "$fails" > "$STATE/fails"
                    [ "$fails" -ge "$THRESHOLD" ] || continue
                    if [ ! -f "$STATE/restarted" ]; then
                      echo "health: '$slug' console unreachable for $fails checks; restarting 7dtd@$slug" >&2
                      touch "$STATE/restarted"
                      systemctl restart "7dtd@$slug.service" || true
                      continue
                    fi
                    # Restarted already this outage and still silent: the host, not
                    # the process, is the problem. Hand it to the ASG.
                    if [ "$fails" -ge $((THRESHOLD * 2)) ]; then
                      mark_unhealthy "server '$slug' stopped responding and did not recover from a restart"
                      exit 0
                    fi
                  done
                  HEALTHCHECK
                  chmod 0755 /usr/local/bin/7dtd-health-check

                  # --- Daily refresh (replace this instance) --------------------
                  # Replace the instance once a day so a long-lived host picks up a
                  # fresh box, whatever the AMI parameter now resolves to, and a
                  # fresh spot pool, rather than accumulating uptime. Terminates
                  # WITHOUT decrementing desired capacity, so the ASG launches a
                  # replacement that reattaches the same save volume (the attach
                  # loop above already waits out the detach race). Acts only when
                  # EVERY server reads positively empty: a player on any world
                  # defers the refresh to the next daily fire rather than
                  # interrupting a session, and an unreachable console is left to
                  # the health check, which is the one that owns a wedged server.
                  cat > /usr/local/bin/7dtd-daily-refresh <<'REFRESH'
                  #!/bin/bash
                  export AWS_DEFAULT_REGION=${AWS::Region}
                  total=0
                  for slug in $(cat /etc/7dtd/servers); do
                    . "/etc/7dtd/$slug/server.env"
                    output=$(/usr/local/bin/7dtd-listplayers "$TELNET_PORT" 2>/dev/null || true)
                    number=$(echo "$output" | grep "in the game" | grep -Eo "[0-9]+" | head -1)
                    if [ -z "$number" ]; then
                      echo "refresh: console for '$slug' unreachable; not replacing this instance" >&2
                      exit 0
                    fi
                    total=$(( total + number ))
                  done
                  if [ "$total" -gt 0 ]; then
                    echo "refresh: $total player(s) connected across the host; deferring to the next daily run" >&2
                    exit 0
                  fi
                  echo "refresh: every server empty; archiving the saves and replacing this instance" >&2
                  # Best-effort: the worlds are on the volume the replacement
                  # reattaches, so a failed archive is not a reason to keep a stale
                  # instance.
                  /usr/local/bin/7dtd-backup || true
                  # Leave the reason for the shutdown notification that follows.
                  mkdir -p /run/7dtd-notify
                  echo "the daily refresh replaced it with a fresh instance" > /run/7dtd-notify/stop_reason
                  TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                  IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                  aws autoscaling terminate-instance-in-auto-scaling-group --instance-id "$IID"
                  REFRESH
                  chmod 0755 /usr/local/bin/7dtd-daily-refresh

                  # --- Shutdown notification ------------------------------------
                  # Sent from the ExecStop of a RemainAfterExit oneshot (see the
                  # unit below), which is how systemd gets a "the host is going
                  # away" hook that still has networking. One email per host, not
                  # per world, because the host is what is going away. The reason is
                  # whatever the path that initiated the shutdown left behind
                  # (idle-stop, spot reclaim, unhealthy replacement); a plain
                  # 7days.bat stop leaves nothing, hence the generic fallback. A
                  # hard kill (host failure, or a stop with no ACPI shutdown) never
                  # runs this, so the absence of a shutdown email is not proof the
                  # server is up.
                  cat > /usr/local/bin/7dtd-stop-notify <<'STOPNOTIFY'
                  #!/bin/bash
                  reason=$(cat /run/7dtd-notify/stop_reason 2>/dev/null || true)
                  [ -n "$reason" ] || reason="it was stopped (desired capacity set to 0, or the instance was replaced)"
                  up=$(uptime -p 2>/dev/null | sed -e 's/^up //' || true)
                  [ -n "$up" ] || up=unknown
                  count=$(wc -l < /etc/7dtd/servers 2>/dev/null || echo 0)
                  /usr/local/bin/7dtd-notify "7DTD: server host is shutting down" \
                    "The host running $count 7 Days to Die server(s) is shutting down: $reason.
                  It was up for $up. Every world save is on the persistent volume, so starting the server again resumes them all."
                  STOPNOTIFY
                  chmod 0755 /usr/local/bin/7dtd-stop-notify

                  # --- Spot interruption drain ----------------------------------
                  # Poll IMDS for the ~2-minute spot interruption notice; on the
                  # warning, warn players and save every world so a reclaim costs at
                  # most a reconnect (the ASG relaunches and the replacement
                  # reattaches the same save volume). On on-demand instances the
                  # metadata stays 404 and this loop simply idles.
                  cat > /usr/local/bin/7dtd-spot-drain <<'SPOTDRAIN'
                  #!/bin/bash
                  while true; do
                    T=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                    action=$(curl -s -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/spot/instance-action)
                    if echo "$action" | grep -q '"action"'; then
                      echo "spot interruption notice received; saving every world" >&2
                      # Leave the reason for the shutdown notification that follows.
                      mkdir -p /run/7dtd-notify
                      echo "its spot capacity was reclaimed by AWS (the ASG will relaunch it and the save volume reattaches)" > /run/7dtd-notify/stop_reason
                      for slug in $(cat /etc/7dtd/servers); do
                        . "/etc/7dtd/$slug/server.env"
                        /usr/local/bin/7dtd-console "$TELNET_PORT" "say \"Server reclaim imminent - saving and restarting shortly\"" || true
                        # saveworld flushes to the volume (which reattaches on
                        # relaunch); the backup below also pushes an off-volume S3
                        # copy of every world before the box is reclaimed.
                        /usr/local/bin/7dtd-console "$TELNET_PORT" "saveworld" || true
                      done
                      /usr/local/bin/7dtd-backup || true
                      sleep 10
                      exit 0
                    fi
                    sleep 5
                  done
                  SPOTDRAIN
                  chmod 0755 /usr/local/bin/7dtd-spot-drain

                  # --- systemd units --------------------------------------------
                  # A template unit, one instance per world. %i is the slug, and
                  # every path this server owns is derived from it, so the unit
                  # needs no per-server environment file of its own.
                  cat > /etc/systemd/system/7dtd@.service <<'SERVERUNIT'
                  [Unit]
                  Description=7 Days to Die Dedicated Server (%i)
                  After=network-online.target opt-games.mount
                  Wants=network-online.target
                  RequiresMountsFor=/opt/games

                  [Service]
                  Type=simple
                  User=sdtd
                  Group=sdtd
                  WorkingDirectory=/opt/games/7days
                  ExecStart=/opt/games/7days/startserver.sh -configfile=/etc/7dtd/%i/serverconfig.xml -userdatafolder=/opt/games/userdata/%i
                  Restart=always
                  RestartSec=15
                  # 7DTD warns that the default 1024 open-file limit can crash the
                  # server and recommends >=10240. systemd services ignore
                  # /etc/security/limits.conf (that is PAM), so raise it here. This
                  # is per server process, not shared across them.
                  LimitNOFILE=100000

                  [Install]
                  WantedBy=multi-user.target
                  SERVERUNIT

                  cat > /etc/systemd/system/7dtd-idle.service <<'IDLEUNIT'
                  [Unit]
                  Description=Scale the ASG to zero when every 7DTD server is empty

                  [Service]
                  Type=oneshot
                  ExecStart=/usr/local/bin/7dtd-idle-check
                  IDLEUNIT

                  cat > /etc/systemd/system/7dtd-idle.timer <<'IDLETIMER'
                  [Unit]
                  Description=Periodic idle-player check across every 7DTD server

                  [Timer]
                  OnBootSec=15min
                  OnUnitActiveSec=${IdleCheckMinutes}min

                  [Install]
                  WantedBy=timers.target
                  IDLETIMER

                  cat > /etc/systemd/system/7dtd-health.service <<'HEALTHUNIT'
                  [Unit]
                  Description=Self-heal check for a wedged 7DTD server process

                  [Service]
                  Type=oneshot
                  ExecStart=/usr/local/bin/7dtd-health-check
                  HEALTHUNIT

                  cat > /etc/systemd/system/7dtd-health.timer <<'HEALTHTIMER'
                  [Unit]
                  Description=Periodic self-heal check across every 7DTD server

                  [Timer]
                  OnBootSec=${HealthCheckMinutes}min
                  OnUnitActiveSec=${HealthCheckMinutes}min

                  [Install]
                  WantedBy=timers.target
                  HEALTHTIMER

                  cat > /etc/systemd/system/7dtd-spot-drain.service <<'SPOTUNIT'
                  [Unit]
                  Description=Save every 7DTD world on a spot interruption notice

                  [Service]
                  Type=simple
                  ExecStart=/usr/local/bin/7dtd-spot-drain
                  Restart=on-failure
                  RestartSec=10

                  [Install]
                  WantedBy=multi-user.target
                  SPOTUNIT

                  cat > /etc/systemd/system/7dtd-backup.service <<'BACKUPUNIT'
                  [Unit]
                  Description=Back up every 7DTD save to S3

                  [Service]
                  Type=oneshot
                  ExecStart=/usr/local/bin/7dtd-backup
                  BACKUPUNIT

                  cat > /etc/systemd/system/7dtd-backup.timer <<'BACKUPTIMER'
                  [Unit]
                  Description=Periodic S3 backup of every 7DTD save

                  [Timer]
                  # 10 min after boot captures each play session shortly after the
                  # worlds load; the BackupIntervalHours cadence covers marathon
                  # sessions. The host idle-stops when every world is empty, so an
                  # idle (unchanging) world is simply never backed up - no wasted
                  # uploads.
                  OnBootSec=10min
                  OnUnitActiveSec=${BackupIntervalHours}h

                  [Install]
                  WantedBy=timers.target
                  BACKUPTIMER

                  cat > /etc/systemd/system/7dtd-refresh.service <<'REFRESHUNIT'
                  [Unit]
                  Description=Replace the 7DTD instance once a day while every server is empty

                  [Service]
                  Type=oneshot
                  ExecStart=/usr/local/bin/7dtd-daily-refresh
                  REFRESHUNIT

                  cat > /etc/systemd/system/7dtd-refresh.timer <<'REFRESHTIMER'
                  [Unit]
                  Description=Daily refresh check for the 7DTD host

                  [Timer]
                  OnCalendar=*-*-* ${DailyRefreshTime}:00
                  # Not Persistent: a missed fire means no instance was running then, so
                  # the next launch is already fresher than a refresh would make it, and
                  # catching up on boot would replace a minutes-old instance.
                  Persistent=false

                  [Install]
                  WantedBy=timers.target
                  REFRESHTIMER

                  # A oneshot that does nothing on start and notifies on stop.
                  # Shutdown reverses ordering, so ordering it After the network
                  # means systemd stops it - running ExecStop - while networking (and
                  # therefore SNS and the IMDS credentials) is still up. Nothing
                  # must ever `systemctl restart` this unit: a restart runs ExecStop
                  # and would email a shutdown that is not happening, which is why
                  # the message text lives in a separate script file that cfn-hup can
                  # rewrite in place without touching the unit.
                  cat > /etc/systemd/system/7dtd-stop-notify.service <<'STOPUNIT'
                  [Unit]
                  Description=Email a notification when the 7DTD server host shuts down
                  After=network-online.target
                  Wants=network-online.target

                  [Service]
                  Type=oneshot
                  RemainAfterExit=yes
                  ExecStart=/bin/true
                  ExecStop=/usr/local/bin/7dtd-stop-notify

                  [Install]
                  WantedBy=multi-user.target
                  STOPUNIT

                  # One watcher per world, so a join email can name which one.
                  cat > /etc/systemd/system/7dtd-login-notify@.service <<'LOGINUNIT'
                  [Unit]
                  Description=Email a notification when a player joins 7DTD server %i
                  After=7dtd@%i.service

                  [Service]
                  Type=simple
                  ExecStart=/usr/local/bin/7dtd-login-notify %i
                  # The watcher exits whenever the console session drops (server
                  # restarting, still generating a world, or reclaimed), so it must
                  # be restarted to reconnect. RestartSec is deliberately long: while
                  # the server is down this is a reconnect poll, and a short interval
                  # would just spam the journal.
                  Restart=always
                  RestartSec=60

                  [Install]
                  WantedBy=multi-user.target
                  LOGINUNIT

                  systemctl daemon-reload
                  for slug in $(cat /etc/7dtd/servers); do
                    # enable --now, never restart: a cfn-hup re-run must not bounce
                    # a world people are playing on. Config changes land on the next
                    # launch, as they always have.
                    systemctl enable --now "7dtd@$slug.service"
                    # Restart (not just enable) so a cfn-hup re-run picks up an
                    # edited watcher script instead of leaving the old one connected.
                    systemctl enable "7dtd-login-notify@$slug.service"
                    systemctl restart "7dtd-login-notify@$slug.service"
                  done
                  # Idle auto-shutdown is toggled by the AutoShutdown parameter.
                  # cfn-hup re-runs this on a parameter change, so flipping it to
                  # disabled stops the timer on a running server (and vice versa).
                  if [ "${AutoShutdown}" = enabled ]; then
                    systemctl enable --now 7dtd-idle.timer
                  else
                    systemctl disable --now 7dtd-idle.timer 2>/dev/null || true
                  fi
                  systemctl enable --now 7dtd-health.timer
                  # Daily instance replacement is toggled by the DailyRefresh
                  # parameter, live on a running server via cfn-hup like AutoShutdown.
                  if [ "${DailyRefresh}" = enabled ]; then
                    systemctl enable --now 7dtd-refresh.timer
                  else
                    systemctl disable --now 7dtd-refresh.timer 2>/dev/null || true
                  fi
                  systemctl enable --now 7dtd-spot-drain.service
                  # enable --now only, never restart: restarting this one fires its
                  # ExecStop and emails a shutdown that is not happening.
                  systemctl enable --now 7dtd-stop-notify.service
                  # Save backups only run if the backup bucket export was found
                  # (env file written above); otherwise stay disabled.
                  if [ -f /etc/7dtd/backup.env ]; then
                    systemctl enable --now 7dtd-backup.timer
                  else
                    systemctl disable --now 7dtd-backup.timer 2>/dev/null || true
                  fi

                  # --- Publish the static server addresses to S3 ----------------
                  # One object per world. Every world shares the Elastic IP read
                  # from the export - no IMDS race, no guessing - and is told apart
                  # by its game port. Local name is fixed; only the S3 key prefix is
                  # configurable (and may contain a path prefix, which a temp
                  # filename could not).
                  for slug in $(cat /etc/7dtd/servers); do
                    . "/etc/7dtd/$slug/server.env"
                    echo "$PUBLIC_IP:$GAME_PORT" > /tmp/7dtd-address.txt
                    aws s3 cp /tmp/7dtd-address.txt "s3://${S3BucketName}/${AddressObjectPrefix}$slug.txt"
                  done

                  # --- CloudWatch agent (memory / disk / swap / cpu) ------------
                  # EC2 only publishes CPU, network and EBS metrics out of the box;
                  # in-guest memory, swap and filesystem usage need the CloudWatch
                  # agent. Deliberately LAST and wrapped so a metrics-setup failure
                  # can never abort the game bootstrap under set -e (installing the
                  # agent also creates the cwagent system user, which is why it must
                  # run after sdtd is pinned - see the service-user note above). The
                  # config's $-dimensions are $-bang escaped so Fn::Sub emits them
                  # literally for the agent to expand at runtime.
                  if ! install_cloudwatch_agent; then
                    echo "WARN: CloudWatch agent setup failed; server is unaffected" >&2
                  fi
          commands:
            01-run-bootstrap:
              command: /opt/bootstrap/run.sh
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-lt
      LaunchTemplateData:
        ImageId: !Ref AMIID
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyPair
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref SecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Ref ServerName
              - Key: AccessControl
                Value: !Ref AccessControlTagValue
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              # The full bootstrap lives in this LaunchTemplate's Metadata
              # (AWS::CloudFormation::Init) because UserData is capped at 16 KB.
              # aws-cfn-bootstrap (cfn-init/cfn-hup) is not packaged for Ubuntu,
              # so install it from pip; 24.04 marks the base environment
              # externally managed (PEP 668), hence --break-system-packages on
              # this single-purpose host.
              apt-get update -y
              apt-get install -y --no-install-recommends python3-pip
              pip3 install --break-system-packages \
                https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz

              # Put the helpers on a stable path for the systemd unit and the
              # reloader hook, then run cfn-init to materialize and execute the
              # bootstrap from Metadata. cfn-init also enables/starts cfn-hup
              # (see the services block), so later Metadata changes re-run it.
              for b in cfn-init cfn-hup cfn-signal cfn-get-metadata; do
                src=$(command -v "$b" || true)
                if [ -n "$src" ] && [ "$src" != "/usr/local/bin/$b" ]; then
                  ln -sf "$src" "/usr/local/bin/$b"
                fi
              done
              /usr/local/bin/cfn-init -v --stack ${AWS::StackName} --resource LaunchTemplate --region ${AWS::Region} --configsets default
  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-asg
      # Scale to zero (empty) and up to one on demand. Max is 1 by design: a
      # 7DTD dedicated server is a single authoritative process owning one world
      # save on one EBS volume, so there is nothing to scale horizontally.
      MinSize: '0'
      MaxSize: '1'
      # DesiredCapacity is intentionally omitted: on create it defaults to
      # MinSize (0), and CloudFormation then leaves runtime desired capacity
      # alone so a stack update never stomps a running server or a scale-up.
      VPCZoneIdentifier:
        - !Ref SubnetId
      # Run on spot for cheap compute; the world save lives on a reattachable
      # EBS volume, so a reclaim costs a reconnect, not the world. The AZ is
      # pinned to the volume, so instance-type diversity is the only spot lever
      # - the Overrides list widens the spot pools. Unavailable types in a given
      # region/AZ are simply skipped, so tune this list to what your region
      # offers (all are ~32 GiB x86; 7DTD has no ARM build). NOTE: at MaxSize 1
      # there is no native spot->on-demand fallback if every pool is dry (see
      # the fallback-automation follow-up).
      MixedInstancesPolicy:
        InstancesDistribution:
          OnDemandBaseCapacity: 0
          OnDemandPercentageAboveBaseCapacity: 0
          OnDemandAllocationStrategy: prioritized
          SpotAllocationStrategy: price-capacity-optimized
        LaunchTemplate:
          LaunchTemplateSpecification:
            LaunchTemplateId: !Ref LaunchTemplate
            Version: !GetAtt LaunchTemplate.LatestVersionNumber
          Overrides:
            - InstanceType: !Ref InstanceType
            - InstanceType: r7i.xlarge
            - InstanceType: m8i.2xlarge
            - InstanceType: r8i.2xlarge
      # EC2 status checks replace a dead host automatically. The game-process
      # self-heal check (on-instance) covers a wedged-but-alive server. Grace is
      # generous so SteamCMD install + first world-gen is not killed mid-boot.
      HealthCheckType: EC2
      HealthCheckGracePeriod: 600
      Tags:
        - Key: Name
          Value: !Ref ServerName
          PropagateAtLaunch: true
        - Key: AccessControl
          Value: !Ref AccessControlTagValue
          PropagateAtLaunch: true

Outputs:
  AutoScalingGroupName:
    Description: Name of the 7days server Auto Scaling Group
    Value: !Ref AutoScalingGroup
    Export:
      Name: Seven-Days-Server-ASG
