AWSTemplateFormatVersion:          '2010-09-09'
Description:                       'Auto Scaling Group (0/1) that serves 7 Days to Die'

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to use

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Subnet the Auto Scaling Group launches into. MUST be in the same
      Availability Zone as the save volume and Elastic IP (the volume is
      created in the region's first AZ, the -a suffix, so pick a subnet in
      that AZ). A single EBS volume attaches to one instance in one AZ, so
      the ASG is pinned here.

  InstanceType:
    Description: EC2 instance type (memory-optimized for large V3.0 RWG worlds; r8i.xlarge = 4 vCPU / 32 GiB)
    Type: String
    Default: r8i.xlarge

  AMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Latest Ubuntu 24.04 LTS AMI (Canonical public SSM parameter)
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  KeyPair:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of SSH keypair

  S3BucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Description: S3 bucket name to put IP and port of server
    Default: 7days-server-ip-bucket

  PortNumber:
    Type: Number
    Description: Primary game port (modern 7DTD default is 26900)
    Default: 26900

  PortNumberTop:
    Type: Number
    Description: Top end game port (ServerPort + 2)
    Default: 26902

  ServerPassword:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Password for server
    Default: 7days-password

  WorldGenSeed:
    Type: String
    Description: Seed for random gen map
    Default: guhishaduas78124

  SandboxCode:
    Type: String
    Description: >-
      V3.0 sandbox configuration string (encodes difficulty, zombie speed, loot,
      blood moon, drop-on-death, day length, etc). Generate your own from the
      in-game Sandbox Options menu. Default is the standard Adventurer preset.
    Default: AAAJABJACJADJARFBNC

Resources:

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ec2
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service:
              - ec2.amazonaws.com
          Action:
            - sts:AssumeRole
      Path: /
      # AmazonSSMManagedInstanceCore lets the pre-installed SSM agent register
      # the instance so we can open Session Manager shells (no SSH/inbound rule).
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-bootstrap
          PolicyDocument:
            Statement:
              # Publish the static server address for clients to discover.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${S3BucketName}/7dserver.txt
              # Read the volume id and Elastic IP from the sibling stacks'
              # exports at boot. ListExports has no resource-level scoping.
              - Effect: Allow
                Action:
                  - cloudformation:ListExports
                Resource: '*'
              # Under an ASG the instance attaches its own storage. Scope
              # AttachVolume to the specific save volume and any instance
              # (the ASG-launched instance id is not known ahead of time).
              - Effect: Allow
                Action:
                  - ec2:AttachVolume
                Resource:
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                  - !Sub
                    - arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/${Vol}
                    - Vol: !ImportValue Seven-Days-Server-Disk
              # Self-associate the Elastic IP on boot. AssociateAddress does not
              # support reliable resource-level scoping across the instance + EIP
              # + primary ENI it touches, so allow it broadly on this dedicated
              # single-purpose role.
              - Effect: Allow
                Action:
                  - ec2:AssociateAddress
                Resource: '*'
              # Describe calls used by the attach wait loop; no resource scoping.
              - Effect: Allow
                Action:
                  - ec2:DescribeVolumes
                  - ec2:DescribeAddresses
                Resource: '*'
              # Idle-stop (terminate + decrement) and self-heal (set unhealthy),
              # scoped to this stack's Auto Scaling Group.
              - Effect: Allow
                Action:
                  - autoscaling:SetInstanceHealth
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                Resource:
                  - !Sub arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/${AWS::StackName}-asg

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Ref AWS::StackName
      GroupDescription: Security group for 7dtd server
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      SecurityGroupIngress:
        # Modern 7DTD needs UDP on ServerPort..ServerPort+2 plus TCP on ServerPort.
        - CidrIp: 0.0.0.0/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumberTop
          IpProtocol: udp
        - CidrIp: 0.0.0.0/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumber
          IpProtocol: tcp

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-lt
      LaunchTemplateData:
        ImageId: !Ref AMIID
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyPair
        IamInstanceProfile:
          Arn: !GetAtt EC2InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref SecurityGroup
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: 7DaysServer
              - Key: AccessControl
                Value: 7Days
        UserData:
          Fn::Base64:
            Fn::Sub: |
              #!/bin/bash
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              export AWS_DEFAULT_REGION=${AWS::Region}

              # --- Packages -------------------------------------------------
              # steamcmd is a 32-bit binary, hence the i386 arch + lib32gcc.
              # expect/telnet drive the console checks over the telnet console.
              dpkg --add-architecture i386
              apt-get update -y
              apt-get install -y --no-install-recommends \
                lib32gcc-s1 expect telnet curl wget tar unzip ca-certificates

              # Ubuntu 24.04 dropped the 'awscli' apt package, so install AWS CLI
              # v2 from Amazon's official installer (arch-aware) at /usr/local/bin/aws.
              if ! command -v aws >/dev/null 2>&1; then
                case "$(uname -m)" in
                  aarch64) AWS_CLI_ARCH=aarch64 ;;
                  *)       AWS_CLI_ARCH=x86_64 ;;
                esac
                curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$AWS_CLI_ARCH.zip" -o /tmp/awscliv2.zip
                unzip -q /tmp/awscliv2.zip -d /tmp
                /tmp/aws/install
                rm -rf /tmp/aws /tmp/awscliv2.zip
              fi

              # --- Instance identity (IMDSv2) -------------------------------
              TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 300")
              IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)

              # --- Cross-stack values (read at boot, not baked into the template)
              # The save volume and Elastic IP are created by sibling stacks and
              # published as CloudFormation exports; read them via the CLI instead
              # of wiring them in as Fn::Sub imports.
              get_export() {
                aws cloudformation list-exports \
                  --query "Exports[?Name=='$1'].Value" --output text
              }
              VOL_ID=$(get_export Seven-Days-Server-Disk)
              ALLOC_ID=$(get_export Seven-Days-Server-Address)
              PUBLIC_IP=$(get_export Seven-Days-Server-Address-IP)
              if [ -z "$VOL_ID" ] || [ "$VOL_ID" = None ]; then
                echo "ERROR: export Seven-Days-Server-Disk not found" >&2; exit 1
              fi
              if [ -z "$ALLOC_ID" ] || [ "$ALLOC_ID" = None ]; then
                echo "ERROR: export Seven-Days-Server-Address not found" >&2; exit 1
              fi
              if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = None ]; then
                echo "ERROR: export Seven-Days-Server-Address-IP not found" >&2; exit 1
              fi

              # --- Claim the Elastic IP -------------------------------------
              # The ASG does not associate EIPs; do it ourselves. --allow-reassociation
              # moves the address off any previous instance still releasing it.
              for i in $(seq 1 12); do
                if aws ec2 associate-address --allocation-id "$ALLOC_ID" --instance-id "$IID" --allow-reassociation >/dev/null 2>&1; then
                  break
                fi
                echo "waiting to associate EIP $ALLOC_ID (attempt $i)..." >&2
                sleep 5
              done

              # --- Service user ---------------------------------------------
              id sdtd &>/dev/null || useradd --system --create-home --home-dir /home/sdtd --shell /usr/sbin/nologin sdtd

              # --- Attach + mount the persistent save volume ----------------
              # The ASG does not attach volumes; attach it to THIS instance and
              # wait until the attachment sticks (survives a brief detach race if
              # a previous instance is still releasing the volume).
              for i in $(seq 1 60); do
                if aws ec2 attach-volume --volume-id "$VOL_ID" --instance-id "$IID" --device /dev/sdf >/dev/null 2>&1; then
                  break
                fi
                cur=$(aws ec2 describe-volumes --volume-ids "$VOL_ID" --query 'Volumes[0].Attachments[0].InstanceId' --output text 2>/dev/null || true)
                if [ "$cur" = "$IID" ]; then
                  break
                fi
                echo "waiting to attach $VOL_ID (attempt $i)..." >&2
                sleep 5
              done

              # On Nitro instances the EBS volume shows up as an NVMe device with a
              # non-deterministic name; the stable path is the by-id symlink keyed on
              # the volume id (dashes stripped). Wait for it, then ONLY format when
              # the volume has no filesystem - never reformat an existing save.
              VOL_NODASH=$(echo "$VOL_ID" | tr -d -)
              BYID="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$VOL_NODASH"
              for i in $(seq 1 30); do [ -e "$BYID" ] && break; sleep 5; done
              DEV=$(readlink -f "$BYID")
              mkdir -p /opt/games
              if ! blkid "$DEV"; then
                mkfs.ext4 -L 7dtd "$DEV"
              fi
              UUID=$(blkid -s UUID -o value "$DEV")
              grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /opt/games ext4 defaults,noatime,nofail 0 2" >> /etc/fstab
              mount -a

              # --- SteamCMD + 7 Days to Die (dedicated server app 294420) ---
              # SteamCMD and the game live on the persistent save volume, so a
              # fresh ASG instance reuses the existing copy instead of
              # reinstalling: only extract SteamCMD when it is missing, and skip
              # the full `validate` re-hash once the app manifest exists (a first
              # install validates; later boots just run app_update to pick up
              # patches, and SteamCMD resumes an interrupted update from its own
              # manifest). On a fresh extract SteamCMD self-updates on first run;
              # that first invocation can fail with "Failed to install app ...
              # (Missing configuration)" before the client is bootstrapped, so
              # retry (up to 5 attempts) rather than letting set -e abort the
              # whole bootstrap on a transient first-run failure.
              mkdir -p /opt/games/steamcmd /opt/games/7days /opt/games/userdata
              chown sdtd:sdtd /opt/games /opt/games/steamcmd /opt/games/7days /opt/games/userdata
              if [ -f /opt/games/7days/steamapps/appmanifest_294420.acf ]; then VALIDATE=""; else VALIDATE="validate"; fi
              sudo -u sdtd bash -s -- "$VALIDATE" <<'STEAMCMD'
              set -eux
              VALIDATE="$1"
              cd /opt/games/steamcmd
              if [ ! -x ./steamcmd.sh ]; then
                curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -
              fi
              n=0
              until ./steamcmd.sh +force_install_dir /opt/games/7days +login anonymous +app_update 294420 $VALIDATE +quit; do
                n=$((n+1))
                if [ "$n" -ge 5 ]; then
                  echo "ERROR: steamcmd app_update 294420 failed after $n attempts" >&2
                  exit 1
                fi
                echo "steamcmd app_update failed (attempt $n), retrying in 15s..." >&2
                sleep 15
              done
              STEAMCMD

              # --- Server config (V3.0 serverconfig.xml) --------------------
              # Rewritten on every launch: under the ASG the template is the
              # source of truth, so config never drifts from what is deployed.
              cat > /opt/games/7days/serverconfig.xml <<'SEVENDAYSCFG'
              <?xml version="1.0"?>
              <ServerSettings>
                <property name="ServerPort" value="${PortNumber}"/>
                <property name="ServerVisibility" value="2"/>
                <property name="ServerName" value="Ru's 7dtd Server"/>
                <property name="ServerPassword" value="${ServerPassword}"/>
                <property name="ServerDescription" value="A 7 Days to Die server"/>
                <property name="ServerWebsiteURL" value=""/>
                <property name="ServerMaxPlayerCount" value="8"/>
                <property name="ServerReservedSlots" value="0"/>
                <property name="ServerReservedSlotsPermission" value="100"/>
                <property name="ServerAdminSlots" value="0"/>
                <property name="ServerAdminSlotsPermission" value="0"/>
                <property name="ServerDisabledNetworkProtocols" value=""/>
                <property name="ServerMaxWorldTransferSpeedKiBs" value="512"/>
                <property name="ServerAllowCrossplay" value="false"/>
                <property name="EACEnabled" value="true"/>
                <property name="IgnoreEOSSanctions" value="false"/>

                <property name="WebDashboardEnabled" value="true"/>
                <property name="WebDashboardPort" value="8080"/>
                <property name="WebDashboardUrl" value=""/>
                <property name="EnableMapRendering" value="true"/>

                <property name="TelnetEnabled" value="true"/>
                <property name="TelnetPort" value="8081"/>
                <property name="TelnetPassword" value="${ServerPassword}"/>
                <property name="TelnetFailedLoginLimit" value="10"/>
                <property name="TelnetFailedLoginsBlocktime" value="300"/>
                <property name="TerminalWindowEnabled" value="false"/>

                <property name="AdminFileName" value="serveradmin.xml"/>

                <property name="GameWorld" value="RWG"/>
                <property name="WorldGenSeed" value="${WorldGenSeed}"/>
                <property name="WorldGenSize" value="6144"/>
                <property name="GameName" value="Midway"/>
                <property name="GameMode" value="GameModeSurvival"/>

                <!-- V3.0: difficulty, zombie speed, loot, blood moon, day length,
                     drop-on-death, air drops, etc. are all encoded in SandboxCode. -->
                <property name="SandboxCode" value="${SandboxCode}"/>

                <property name="PlayerKillingMode" value="3"/>
                <property name="PersistentPlayerProfiles" value="false"/>
                <property name="PlayerSafeZoneLevel" value="5"/>
                <property name="PlayerSafeZoneHours" value="5"/>
                <property name="BedrollDeadZoneSize" value="15"/>
                <property name="PartySharedKillRange" value="100"/>

                <property name="LandClaimSize" value="41"/>
                <property name="LandClaimDeadZone" value="30"/>
                <property name="LandClaimExpiryTime" value="3"/>
                <property name="LandClaimDecayMode" value="0"/>
                <property name="LandClaimOnlineDurabilityModifier" value="4"/>
                <property name="LandClaimOfflineDurabilityModifier" value="4"/>

                <property name="DynamicMeshEnabled" value="true"/>
                <property name="DynamicMeshLandClaimOnly" value="true"/>
                <property name="DynamicMeshLandClaimBuffer" value="3"/>
                <property name="DynamicMeshMaxItemCache" value="3"/>

                <property name="MaxSpawnedZombies" value="60"/>
                <property name="MaxSpawnedAnimals" value="50"/>
                <property name="MaxUncoveredMapChunksPerPlayer" value="131072"/>
                <property name="HideCommandExecutionLog" value="0"/>
              </ServerSettings>
              SEVENDAYSCFG
              chown sdtd:sdtd /opt/games/7days/serverconfig.xml

              # --- Telnet console reader ------------------------------------
              # Connects to the telnet console and runs listplayers; used by both
              # the idle check and the self-heal check below.
              cat > /usr/local/bin/7dtd-listplayers <<'LISTPLAYERS'
              #!/usr/bin/expect
              set timeout 20
              spawn telnet localhost 8081
              expect -re "Please enter password:"
              send "${ServerPassword}\r"
              expect -re "end session."
              send "listplayers\r"
              expect -re "in the game"
              send "exit\r"
              LISTPLAYERS
              chmod 0755 /usr/local/bin/7dtd-listplayers

              # --- Idle check (scale the ASG to zero) -----------------------
              # Connects to the telnet console, runs listplayers, and terminates
              # THIS instance while decrementing desired capacity to 0 ONLY when
              # it positively reads zero players. A plain OS shutdown would just
              # be relaunched while desired capacity is 1. If the server/telnet is
              # unreachable the number stays empty and we do NOT scale down.
              cat > /usr/local/bin/7dtd-idle-check <<'IDLECHECK'
              #!/bin/bash
              export AWS_DEFAULT_REGION=${AWS::Region}
              output=$(/usr/local/bin/7dtd-listplayers 2>/dev/null || true)
              number=$(echo "$output" | grep "in the game" | grep -Eo "[0-9]+" | head -1)
              if [ -n "$number" ] && [ "$number" -eq 0 ]; then
                TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                aws autoscaling terminate-instance-in-auto-scaling-group \
                  --instance-id "$IID" --should-decrement-desired-capacity
              fi
              IDLECHECK
              chmod 0755 /usr/local/bin/7dtd-idle-check

              # --- Self-heal check (replace a wedged game process) ----------
              # If the console was reachable before but has since stopped
              # responding for THRESHOLD consecutive checks, mark THIS instance
              # Unhealthy so the ASG replaces it. Fail-safe: do nothing until the
              # server has been healthy at least once this boot (state lives on
              # tmpfs /run so it resets each launch), which prevents killing a
              # slow first boot / world-gen. Dead hosts are handled underneath by
              # the ASG's EC2 status-check health type.
              cat > /usr/local/bin/7dtd-health-check <<'HEALTHCHECK'
              #!/bin/bash
              export AWS_DEFAULT_REGION=${AWS::Region}
              STATE=/run/7dtd-health
              READY_MARK="$STATE/was_healthy"
              FAILS_FILE="$STATE/fails"
              THRESHOLD=3
              mkdir -p "$STATE"
              output=$(/usr/local/bin/7dtd-listplayers 2>/dev/null || true)
              if echo "$output" | grep -q "in the game"; then
                echo 0 > "$FAILS_FILE"
                touch "$READY_MARK"
                exit 0
              fi
              # Unreachable: ignore entirely until the server has been healthy once.
              [ -f "$READY_MARK" ] || exit 0
              fails=$(cat "$FAILS_FILE" 2>/dev/null || echo 0)
              fails=$((fails+1))
              echo "$fails" > "$FAILS_FILE"
              if [ "$fails" -ge "$THRESHOLD" ]; then
                TOKEN=$(curl -sX PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                IID=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                echo "7dtd console unreachable for $fails checks; marking $IID Unhealthy" >&2
                aws autoscaling set-instance-health --instance-id "$IID" --health-status Unhealthy
              fi
              HEALTHCHECK
              chmod 0755 /usr/local/bin/7dtd-health-check

              # --- systemd units --------------------------------------------
              cat > /etc/systemd/system/7dtd.service <<'SERVERUNIT'
              [Unit]
              Description=7 Days to Die Dedicated Server
              After=network-online.target opt-games.mount
              Wants=network-online.target
              RequiresMountsFor=/opt/games

              [Service]
              Type=simple
              User=sdtd
              Group=sdtd
              WorkingDirectory=/opt/games/7days
              ExecStart=/opt/games/7days/startserver.sh -configfile=/opt/games/7days/serverconfig.xml -userdatafolder=/opt/games/userdata
              Restart=always
              RestartSec=15

              [Install]
              WantedBy=multi-user.target
              SERVERUNIT

              cat > /etc/systemd/system/7dtd-idle.service <<'IDLEUNIT'
              [Unit]
              Description=Scale the ASG to zero when the 7DTD server is empty

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/7dtd-idle-check
              IDLEUNIT

              cat > /etc/systemd/system/7dtd-idle.timer <<'IDLETIMER'
              [Unit]
              Description=Periodic idle-player check for the 7DTD server

              [Timer]
              OnBootSec=15min
              OnUnitActiveSec=20min

              [Install]
              WantedBy=timers.target
              IDLETIMER

              cat > /etc/systemd/system/7dtd-health.service <<'HEALTHUNIT'
              [Unit]
              Description=Self-heal check for a wedged 7DTD server process

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/7dtd-health-check
              HEALTHUNIT

              cat > /etc/systemd/system/7dtd-health.timer <<'HEALTHTIMER'
              [Unit]
              Description=Periodic self-heal check for the 7DTD server

              [Timer]
              OnBootSec=5min
              OnUnitActiveSec=5min

              [Install]
              WantedBy=timers.target
              HEALTHTIMER

              systemctl daemon-reload
              systemctl enable --now 7dtd.service
              systemctl enable --now 7dtd-idle.timer
              systemctl enable --now 7dtd-health.timer

              # --- Publish the static server address to S3 ------------------
              # Uses the Elastic IP read from the export - no IMDS race, no guessing.
              echo "$PUBLIC_IP:${PortNumber}" > /tmp/7dserver.txt
              aws s3 cp /tmp/7dserver.txt s3://${S3BucketName}/7dserver.txt

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-asg
      # Scale to zero (empty) and up to one on demand. Max is 1 by design: a
      # 7DTD dedicated server is a single authoritative process owning one world
      # save on one EBS volume, so there is nothing to scale horizontally.
      MinSize: '0'
      MaxSize: '1'
      # DesiredCapacity is intentionally omitted: on create it defaults to
      # MinSize (0), and CloudFormation then leaves runtime desired capacity
      # alone so a stack update never stomps a running server or a scale-up.
      VPCZoneIdentifier:
        - !Ref SubnetId
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      # EC2 status checks replace a dead host automatically. The game-process
      # self-heal check (on-instance) covers a wedged-but-alive server. Grace is
      # generous so SteamCMD install + first world-gen is not killed mid-boot.
      HealthCheckType: EC2
      HealthCheckGracePeriod: 600
      Tags:
        - Key: Name
          Value: 7DaysServer
          PropagateAtLaunch: true
        - Key: AccessControl
          Value: 7Days
          PropagateAtLaunch: true

Outputs:
  AutoScalingGroupName:
    Description: Name of the 7days server Auto Scaling Group
    Value: !Ref AutoScalingGroup
    Export:
      Name: Seven-Days-Server-ASG
