AWSTemplateFormatVersion:          '2010-09-09'
Description:                       'EC2 Instance that serves 7 Days to Die'

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to use

  InstanceType:
    Description: EC2 instance type (memory-optimized for large V3.0 RWG worlds; r8i.xlarge = 4 vCPU / 32 GiB)
    Type: String
    Default: r8i.xlarge

  AMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Latest Ubuntu 24.04 LTS AMI (Canonical public SSM parameter)
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  KeyPair:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Name of SSH keypair
    Default: seven-days-server

  S3BucketName:
    Type: AWS::SSM::Parameter::Value<String>
    Description: S3 bucket name to put IP and port of server
    Default: 7days-server-ip-bucket

  PortNumber:
    Type: Number
    Description: Primary game port (modern 7DTD default is 26900)
    Default: 26900

  PortNumberTop:
    Type: Number
    Description: Top end game port (ServerPort + 2)
    Default: 26902

  ServerPassword:
    Type: AWS::SSM::Parameter::Value<String>
    Description: Password for server
    Default: 7days-password

  WorldGenSeed:
    Type: String
    Description: Seed for random gen map
    Default: guhishaduas78124

  SandboxCode:
    Type: String
    Description: >-
      V3.0 sandbox configuration string (encodes difficulty, zombie speed, loot,
      blood moon, drop-on-death, day length, etc). Generate your own from the
      in-game Sandbox Options menu. Default is the standard Adventurer preset.
    Default: AAAJABJACJADJARFBNC

Resources:

  EC2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-ec2
      AssumeRolePolicyDocument:
        Statement:
        - Effect: Allow
          Principal:
            Service:
              - ec2.amazonaws.com
          Action:
            - sts:AssumeRole
      Path: /
      # AmazonSSMManagedInstanceCore lets the pre-installed SSM agent register
      # the instance so we can open Session Manager shells (no SSH/inbound rule).
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: !Sub ${AWS::StackName}-bootstrap
          PolicyDocument:
            Statement:
              # Publish the static server address for clients to discover.
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${S3BucketName}/7dserver.txt
              # Read the volume id and Elastic IP from the sibling stacks'
              # exports at boot. ListExports has no resource-level scoping.
              - Effect: Allow
                Action:
                  - cloudformation:ListExports
                Resource: '*'

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref EC2InstanceRole

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Ref AWS::StackName
      GroupDescription: Security group for 7dtd server
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          IpProtocol: -1
      SecurityGroupIngress:
        # Modern 7DTD needs UDP on ServerPort..ServerPort+2 plus TCP on ServerPort.
        - CidrIp: 0.0.0.0/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumberTop
          IpProtocol: udp
        - CidrIp: 0.0.0.0/0
          FromPort: !Ref PortNumber
          ToPort: !Ref PortNumber
          IpProtocol: tcp

  DiskAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      Device: /dev/xvdc
      InstanceId: !Ref EC2Instance
      VolumeId: !ImportValue Seven-Days-Server-Disk

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !ImportValue Seven-Days-Server-Address
      InstanceId: !Ref EC2Instance

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AMIID
      AvailabilityZone: !Sub ${AWS::Region}a
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref EC2InstanceProfile
      KeyName: !Ref KeyPair
      SecurityGroupIds:
        - !Ref SecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      Tags:
        - Key: AccessControl
          Value: 7Days
        - Key: Name
          Value: 7DaysServer
      UserData:
        Fn::Base64:
          Fn::Sub: |
              #!/bin/bash
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive

              # --- Packages -------------------------------------------------
              # steamcmd is a 32-bit binary, hence the i386 arch + lib32gcc.
              # expect/telnet drive the idle-player check over the telnet console.
              dpkg --add-architecture i386
              apt-get update -y
              apt-get install -y --no-install-recommends \
                lib32gcc-s1 expect telnet curl wget tar unzip ca-certificates

              # Ubuntu 24.04 dropped the 'awscli' apt package, so install AWS CLI
              # v2 from Amazon's official installer (arch-aware) at /usr/local/bin/aws.
              if ! command -v aws >/dev/null 2>&1; then
                case "$(uname -m)" in
                  aarch64) AWS_CLI_ARCH=aarch64 ;;
                  *)       AWS_CLI_ARCH=x86_64 ;;
                esac
                curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$AWS_CLI_ARCH.zip" -o /tmp/awscliv2.zip
                unzip -q /tmp/awscliv2.zip -d /tmp
                /tmp/aws/install
                rm -rf /tmp/aws /tmp/awscliv2.zip
              fi

              # --- Cross-stack values (read at boot, not baked into the template)
              # The save volume and Elastic IP are created by sibling stacks and
              # published as CloudFormation exports; read them via the CLI instead
              # of wiring them in as Fn::Sub imports.
              export AWS_DEFAULT_REGION=${AWS::Region}
              get_export() {
                aws cloudformation list-exports \
                  --query "Exports[?Name=='$1'].Value" --output text
              }
              VOL_ID=$(get_export Seven-Days-Server-Disk)
              PUBLIC_IP=$(get_export Seven-Days-Server-Address-IP)
              if [ -z "$VOL_ID" ] || [ "$VOL_ID" = None ]; then
                echo "ERROR: export Seven-Days-Server-Disk not found" >&2; exit 1
              fi
              if [ -z "$PUBLIC_IP" ] || [ "$PUBLIC_IP" = None ]; then
                echo "ERROR: export Seven-Days-Server-Address-IP not found" >&2; exit 1
              fi

              # --- Service user ---------------------------------------------
              id sdtd &>/dev/null || useradd --system --create-home --home-dir /home/sdtd --shell /usr/sbin/nologin sdtd

              # --- Persistent save volume -----------------------------------
              # On Nitro instances the EBS volume shows up as an NVMe device with a
              # non-deterministic name; the stable path is the by-id symlink keyed on
              # the volume id (dashes stripped). Wait for it, then ONLY format when
              # the volume has no filesystem - never reformat an existing save.
              VOL_NODASH=$(echo "$VOL_ID" | tr -d -)
              BYID="/dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_$VOL_NODASH"
              for i in $(seq 1 30); do [ -e "$BYID" ] && break; sleep 5; done
              DEV=$(readlink -f "$BYID")
              mkdir -p /opt/games
              if ! blkid "$DEV"; then
                mkfs.ext4 -L 7dtd "$DEV"
              fi
              UUID=$(blkid -s UUID -o value "$DEV")
              grep -q "$UUID" /etc/fstab || echo "UUID=$UUID /opt/games ext4 defaults,noatime,nofail 0 2" >> /etc/fstab
              mount -a

              # --- SteamCMD + 7 Days to Die (dedicated server app 294420) ---
              # Install onto the persistent volume, log in anonymously (no creds).
              mkdir -p /opt/games/steamcmd /opt/games/7days /opt/games/userdata
              chown -R sdtd:sdtd /opt/games
              sudo -u sdtd bash -c '
                cd /opt/games/steamcmd
                curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -
                ./steamcmd.sh +force_install_dir /opt/games/7days +login anonymous +app_update 294420 validate +quit
              '

              # --- Server config (V3.0 serverconfig.xml) --------------------
              cat > /opt/games/7days/serverconfig.xml <<'SEVENDAYSCFG'
              <?xml version="1.0"?>
              <ServerSettings>
                <property name="ServerPort" value="${PortNumber}"/>
                <property name="ServerVisibility" value="2"/>
                <property name="ServerName" value="Ru's 7dtd Server"/>
                <property name="ServerPassword" value="${ServerPassword}"/>
                <property name="ServerDescription" value="A 7 Days to Die server"/>
                <property name="ServerWebsiteURL" value=""/>
                <property name="ServerMaxPlayerCount" value="8"/>
                <property name="ServerReservedSlots" value="0"/>
                <property name="ServerReservedSlotsPermission" value="100"/>
                <property name="ServerAdminSlots" value="0"/>
                <property name="ServerAdminSlotsPermission" value="0"/>
                <property name="ServerDisabledNetworkProtocols" value=""/>
                <property name="ServerMaxWorldTransferSpeedKiBs" value="512"/>
                <property name="ServerAllowCrossplay" value="false"/>
                <property name="EACEnabled" value="true"/>
                <property name="IgnoreEOSSanctions" value="false"/>

                <property name="WebDashboardEnabled" value="true"/>
                <property name="WebDashboardPort" value="8080"/>
                <property name="WebDashboardUrl" value=""/>
                <property name="EnableMapRendering" value="true"/>

                <property name="TelnetEnabled" value="true"/>
                <property name="TelnetPort" value="8081"/>
                <property name="TelnetPassword" value="${ServerPassword}"/>
                <property name="TelnetFailedLoginLimit" value="10"/>
                <property name="TelnetFailedLoginsBlocktime" value="300"/>
                <property name="TerminalWindowEnabled" value="false"/>

                <property name="AdminFileName" value="serveradmin.xml"/>

                <property name="GameWorld" value="RWG"/>
                <property name="WorldGenSeed" value="${WorldGenSeed}"/>
                <property name="WorldGenSize" value="6144"/>
                <property name="GameName" value="Midway"/>
                <property name="GameMode" value="GameModeSurvival"/>

                <!-- V3.0: difficulty, zombie speed, loot, blood moon, day length,
                     drop-on-death, air drops, etc. are all encoded in SandboxCode. -->
                <property name="SandboxCode" value="${SandboxCode}"/>

                <property name="PlayerKillingMode" value="3"/>
                <property name="PersistentPlayerProfiles" value="false"/>
                <property name="PlayerSafeZoneLevel" value="5"/>
                <property name="PlayerSafeZoneHours" value="5"/>
                <property name="BedrollDeadZoneSize" value="15"/>
                <property name="PartySharedKillRange" value="100"/>

                <property name="LandClaimSize" value="41"/>
                <property name="LandClaimDeadZone" value="30"/>
                <property name="LandClaimExpiryTime" value="3"/>
                <property name="LandClaimDecayMode" value="0"/>
                <property name="LandClaimOnlineDurabilityModifier" value="4"/>
                <property name="LandClaimOfflineDurabilityModifier" value="4"/>

                <property name="DynamicMeshEnabled" value="true"/>
                <property name="DynamicMeshLandClaimOnly" value="true"/>
                <property name="DynamicMeshLandClaimBuffer" value="3"/>
                <property name="DynamicMeshMaxItemCache" value="3"/>

                <property name="MaxSpawnedZombies" value="60"/>
                <property name="MaxSpawnedAnimals" value="50"/>
                <property name="MaxUncoveredMapChunksPerPlayer" value="131072"/>
                <property name="HideCommandExecutionLog" value="0"/>
              </ServerSettings>
              SEVENDAYSCFG

              # --- Idle-player check (drives an instance stop when empty) ---
              # Connects to the telnet console, runs listplayers, and shuts the
              # instance down ONLY when it positively reads zero players. If the
              # server/telnet is unreachable, number stays empty and we do NOT
              # shut down (fail safe).
              cat > /usr/local/bin/7dtd-listplayers <<'LISTPLAYERS'
              #!/usr/bin/expect
              set timeout 20
              spawn telnet localhost 8081
              expect -re "Please enter password:"
              send "${ServerPassword}\r"
              expect -re "end session."
              send "listplayers\r"
              expect -re "in the game"
              send "exit\r"
              LISTPLAYERS
              chmod 0755 /usr/local/bin/7dtd-listplayers

              cat > /usr/local/bin/7dtd-idle-check <<'IDLECHECK'
              #!/bin/bash
              output=$(/usr/local/bin/7dtd-listplayers 2>/dev/null || true)
              number=$(echo "$output" | grep "in the game" | grep -Eo "[0-9]+" | head -1)
              if [ -n "$number" ] && [ "$number" -eq 0 ]; then
                /sbin/shutdown -h now
              fi
              IDLECHECK
              chmod 0755 /usr/local/bin/7dtd-idle-check

              # --- systemd units --------------------------------------------
              cat > /etc/systemd/system/7dtd.service <<'SERVERUNIT'
              [Unit]
              Description=7 Days to Die Dedicated Server
              After=network-online.target opt-games.mount
              Wants=network-online.target
              RequiresMountsFor=/opt/games

              [Service]
              Type=simple
              User=sdtd
              Group=sdtd
              WorkingDirectory=/opt/games/7days
              ExecStart=/opt/games/7days/startserver.sh -configfile=/opt/games/7days/serverconfig.xml -userdatafolder=/opt/games/userdata
              Restart=always
              RestartSec=15

              [Install]
              WantedBy=multi-user.target
              SERVERUNIT

              cat > /etc/systemd/system/7dtd-idle.service <<'IDLEUNIT'
              [Unit]
              Description=Shut down the instance when the 7DTD server is empty

              [Service]
              Type=oneshot
              ExecStart=/usr/local/bin/7dtd-idle-check
              IDLEUNIT

              cat > /etc/systemd/system/7dtd-idle.timer <<'IDLETIMER'
              [Unit]
              Description=Periodic idle-player check for the 7DTD server

              [Timer]
              OnBootSec=15min
              OnUnitActiveSec=20min

              [Install]
              WantedBy=timers.target
              IDLETIMER

              chown -R sdtd:sdtd /opt/games
              systemctl daemon-reload
              systemctl enable --now 7dtd.service
              systemctl enable --now 7dtd-idle.timer

              # --- Publish the static server address to S3 ------------------
              # Uses the Elastic IP read from the export - no IMDS race, no guessing.
              echo "$PUBLIC_IP:${PortNumber}" > /tmp/7dserver.txt
              aws s3 cp /tmp/7dserver.txt s3://${S3BucketName}/7dserver.txt

Outputs:
  InstanceIP:
    Description: Instance ID of 7days server
    Value: !Ref EC2Instance
    Export:
      Name: Seven-Days-Server-Instance
